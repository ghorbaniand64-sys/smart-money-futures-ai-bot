name: Smart Money Futures AI Bot V15.6.4

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: smart-money-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run V15.6.4 scan
        env:
          ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
          GMX_PRIVATE_KEY: ${{ secrets.GMX_PRIVATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXECUTION_ENABLED: ${{ vars.EXECUTION_ENABLED || 'false' }}
        run: node --experimental-specifier-resolution=node github-runner.mjs

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state.json gmx_cache.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(bot): persist V15.6.4 runtime state [skip ci]"
            git push
          fi
