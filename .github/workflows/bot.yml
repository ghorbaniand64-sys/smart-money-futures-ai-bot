name: Smart Money Futures AI Bot V15.6.4

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: smart-money-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Patch GMX SDK ESM imports
        shell: bash
        run: |
          set -e

          SDK_DIR="node_modules/@gmx-io/sdk/build/esm/src"

          echo "========================================"
          echo "GMX SDK VERSION"
          echo "========================================"

          node -e "const p=require('./node_modules/@gmx-io/sdk/package.json'); console.log(p.version)"

          echo ""
          echo "========================================"
          echo "CHECKING SDK FILES"
          echo "========================================"

          test -f "$SDK_DIR/configs/api.js"
          test -f "$SDK_DIR/clients/v2/index.js"

          echo "configs/api.js:"
          ls -l "$SDK_DIR/configs/api.js"

          echo ""
          echo "clients/v2/index.js:"
          ls -l "$SDK_DIR/clients/v2/index.js"

          echo ""
          echo "========================================"
          echo "PATCHING LOCAL ESM IMPORTS"
          echo "========================================"

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = path.resolve("node_modules/@gmx-io/sdk/build/esm/src");

          function walk(dir) {
            const result = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                result.push(...walk(full));
              } else if (entry.isFile() && full.endsWith(".js")) {
                result.push(full);
              }
            }
            return result;
          }

          const files = walk(root);

          let changed = 0;
          let replacements = 0;

          for (const file of files) {
            let source = fs.readFileSync(file, "utf8");
            const original = source;

            source = source.replace(
              /(\bfrom\s+["'])(\.{1,2}\/[^"']+?)(["'])/g,
              (match, prefix, specifier, suffix) => {
                if (
                  specifier.endsWith(".js") ||
                  specifier.endsWith(".json") ||
                  specifier.endsWith(".mjs") ||
                  specifier.endsWith(".cjs")
                ) {
                  return match;
                }

                const candidate = path.resolve(path.dirname(file), specifier);
                const candidateJs = `${candidate}.js`;
                const candidateIndex = path.join(candidate, "index.js");

                if (fs.existsSync(candidateJs)) {
                  replacements++;
                  return `${prefix}${specifier}.js${suffix}`;
                }

                if (fs.existsSync(candidateIndex)) {
                  replacements++;
                  return `${prefix}${specifier}/index.js${suffix}`;
                }

                return match;
              }
            );

            source = source.replace(
              /(\bimport\s*\(\s*["'])(\.{1,2}\/[^"']+?)(["']\s*\))/g,
              (match, prefix, specifier, suffix) => {
                if (
                  specifier.endsWith(".js") ||
                  specifier.endsWith(".json") ||
                  specifier.endsWith(".mjs") ||
                  specifier.endsWith(".cjs")
                ) {
                  return match;
                }

                const candidate = path.resolve(path.dirname(file), specifier);
                const candidateJs = `${candidate}.js`;
                const candidateIndex = path.join(candidate, "index.js");

                if (fs.existsSync(candidateJs)) {
                  replacements++;
                  return `${prefix}${specifier}.js${suffix}`;
                }

                if (fs.existsSync(candidateIndex)) {
                  replacements++;
                  return `${prefix}${specifier}/index.js${suffix}`;
                }

                return match;
              }
            );

            if (source !== original) {
              fs.writeFileSync(file, source);
              changed++;
              console.log(
                "PATCHED:",
                path.relative(process.cwd(), file)
              );
            }
          }

          console.log("");
          console.log("SDK JS files changed:", changed);
          console.log("Import replacements:", replacements);
          NODE

          echo ""
          echo "========================================"
          echo "VERIFYING PROBLEMATIC IMPORT"
          echo "========================================"

          grep -n "configs/api" \
            node_modules/@gmx-io/sdk/build/esm/src/clients/v2/index.js \
            || true

      - name: Verify GMX SDK import
        run: |
          node --input-type=module <<'NODE'
          import { GmxApiSdk } from "@gmx-io/sdk/v2";

          console.log("GMX SDK v2 import: OK");
          console.log("GmxApiSdk:", typeof GmxApiSdk);
          NODE

      - name: Run V15.6.4 scan
        env:
          ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
          GMX_PRIVATE_KEY: ${{ secrets.GMX_PRIVATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXECUTION_ENABLED: ${{ vars.EXECUTION_ENABLED || 'false' }}
        run: node github-runner.mjs

      - name: Persist bot state
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "PERSIST BOT STATE"
          echo "========================================"

          if [ ! -d "state" ]; then
            echo "state directory does not exist."
            echo "Nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/bot_state.json state/gmx_cache.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(bot): persist V15.6.4 runtime state [skip ci]"
            git push
          fi
