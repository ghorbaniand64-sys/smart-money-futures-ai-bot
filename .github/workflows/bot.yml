name: Smart Money Futures AI Bot V15.6.4

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: smart-money-bot-scan
  cancel-in-progress: false

jobs:
  scan:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Patch GMX SDK ESM imports
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GMX SDK VERSION"
          echo "========================================"

          node -e "const p=require('./node_modules/@gmx-io/sdk/package.json'); console.log('SDK version:', p.version)"

          echo ""
          echo "========================================"
          echo "PATCHING ESM IMPORTS"
          echo "========================================"

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const projectRoot = process.cwd();
          const sdkRoot = path.resolve(
            projectRoot,
            "node_modules/@gmx-io/sdk/build/esm/src"
          );

          function walk(dir) {
            const result = [];

            if (!fs.existsSync(dir)) {
              return result;
            }

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                result.push(...walk(full));
              } else if (
                entry.isFile() &&
                full.endsWith(".js")
              ) {
                result.push(full);
              }
            }

            return result;
          }

          function fileExists(candidate) {
            try {
              return fs.statSync(candidate).isFile();
            } catch {
              return false;
            }
          }

          function resolveImport(importerFile, specifier) {
            /*
             * Relative import:
             * ./foo
             * ../foo
             */
            if (
              specifier.startsWith("./") ||
              specifier.startsWith("../")
            ) {
              const base = path.resolve(
                path.dirname(importerFile),
                specifier
              );

              if (fileExists(`${base}.js`)) {
                return `${specifier}.js`;
              }

              if (fileExists(path.join(base, "index.js"))) {
                return `${specifier}/index.js`;
              }

              return null;
            }

            /*
             * Package subpath import:
             * lodash/isPlainObject
             * some-package/foo/bar
             *
             * Do NOT modify package-root imports such as:
             * lodash
             * ethers
             * @gmx-io/sdk
             */
            if (!specifier.includes("/")) {
              return null;
            }

            let currentDir = path.dirname(importerFile);

            while (true) {
              const nodeModules = path.join(
                currentDir,
                "node_modules"
              );

              const candidate = path.join(
                nodeModules,
                specifier
              );

              if (fileExists(`${candidate}.js`)) {
                return `${specifier}.js`;
              }

              if (fileExists(path.join(candidate, "index.js"))) {
                return `${specifier}/index.js`;
              }

              const parent = path.dirname(currentDir);

              if (parent === currentDir) {
                break;
              }

              currentDir = parent;
            }

            return null;
          }

          function patchSource(source, file) {
            let replacements = 0;

            /*
             * Static imports:
             * import x from "..."
             * export x from "..."
             */
            source = source.replace(
              /(\b(?:from|import)\s*["'])([^"']+)(["'])/g,
              (match, prefix, specifier, suffix) => {
                if (
                  specifier.startsWith("node:") ||
                  specifier.startsWith("data:") ||
                  specifier.endsWith(".js") ||
                  specifier.endsWith(".json") ||
                  specifier.endsWith(".mjs") ||
                  specifier.endsWith(".cjs")
                ) {
                  return match;
                }

                const resolved = resolveImport(
                  file,
                  specifier
                );

                if (!resolved) {
                  return match;
                }

                replacements++;

                return `${prefix}${resolved}${suffix}`;
              }
            );

            /*
             * Dynamic imports:
             * import("...")
             */
            source = source.replace(
              /(\bimport\s*\(\s*["'])([^"']+)(["']\s*\))/g,
              (match, prefix, specifier, suffix) => {
                if (
                  specifier.startsWith("node:") ||
                  specifier.startsWith("data:") ||
                  specifier.endsWith(".js") ||
                  specifier.endsWith(".json") ||
                  specifier.endsWith(".mjs") ||
                  specifier.endsWith(".cjs")
                ) {
                  return match;
                }

                const resolved = resolveImport(
                  file,
                  specifier
                );

                if (!resolved) {
                  return match;
                }

                replacements++;

                return `${prefix}${resolved}${suffix}`;
              }
            );

            return {
              source,
              replacements
            };
          }

          const files = walk(sdkRoot);

          let changedFiles = 0;
          let totalReplacements = 0;

          for (const file of files) {
            const original = fs.readFileSync(
              file,
              "utf8"
            );

            const result = patchSource(
              original,
              file
            );

            if (result.source !== original) {
              fs.writeFileSync(
                file,
                result.source,
                "utf8"
              );

              changedFiles++;
              totalReplacements += result.replacements;

              console.log(
                "PATCHED:",
                path.relative(projectRoot, file),
                "replacements:",
                result.replacements
              );
            }
          }

          console.log("");
          console.log(
            "SDK files changed:",
            changedFiles
          );

          console.log(
            "Total import replacements:",
            totalReplacements
          );
          NODE

          echo ""
          echo "========================================"
          echo "VERIFYING KNOWN IMPORTS"
          echo "========================================"

          grep -R -n \
            "configs/api" \
            node_modules/@gmx-io/sdk/build/esm/src \
            | head -20 || true

          echo ""

          grep -R -n \
            "lodash/isPlainObject" \
            node_modules/@gmx-io/sdk/build/esm/src \
            | head -20 || true

      - name: Verify GMX SDK import
        run: |
          echo "========================================"
          echo "VERIFY GMX SDK V2"
          echo "========================================"

          node --input-type=module <<'NODE'
          import { GmxApiSdk } from "@gmx-io/sdk/v2";

          console.log("GMX SDK v2 import: OK");
          console.log("GmxApiSdk type:", typeof GmxApiSdk);
          NODE

      - name: Verify Telegram secrets are available
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFY TELEGRAM CONFIGURATION"
          echo "========================================"

          if [ -n "$TELEGRAM_TOKEN" ]; then
            echo "TELEGRAM_TOKEN: PRESENT"
          else
            echo "TELEGRAM_TOKEN: MISSING"
          fi

          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID: PRESENT"
          else
            echo "TELEGRAM_CHAT_ID: MISSING"
          fi

          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo ""
            echo "ERROR: Telegram secrets are not available to this job."
            echo "Check Environment: production"
            echo "Check secret names: TELEGRAM_TOKEN / TELEGRAM_CHAT_ID"
            exit 1
          fi

          echo ""
          echo "Telegram secrets are available."

      - name: Run V15.6.4 scan
        env:
          ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
          GMX_PRIVATE_KEY: ${{ secrets.GMX_PRIVATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXECUTION_ENABLED: ${{ vars.EXECUTION_ENABLED || 'false' }}
        run: node github-runner.mjs

      - name: Persist bot state
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "PERSIST BOT STATE"
          echo "========================================"

          if [ ! -d "state" ]; then
            echo "state directory does not exist."
            echo "Nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/bot_state.json state/gmx_cache.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(bot): persist V15.6.4 runtime state [skip ci]"
            git push
          fi
