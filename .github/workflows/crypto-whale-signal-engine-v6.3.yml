name: CRYPTO WHALE SIGNAL ENGINE V6.3

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine-production
  cancel-in-progress: false

jobs:
  whale-signal-engine:
    name: Crypto Whale Signal Engine V6.3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      NODE_ENV: production

      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      EXPECTED_ENGINE_VERSION: "V6.3"

      WHALE_TARGET_SPOT_WALLETS: "5"
      WHALE_TARGET_FUTURES_WALLETS: "5"
      WHALE_DISCOVERY_TTL_MIN: "45"
      WHALE_DISCOVERY_REFRESH_EACH_CYCLE: "true"

      WHALE_TRADER_MIN_WR: "55"
      WHALE_TRADER_MIN_PF: "1.25"
      WHALE_TRADER_MIN_CLOSED_TRADES: "10"
      WHALE_TRADER_MIN_PNL_USD: "0"
      WHALE_TRADER_MAX_DD_PCT: "25"
      WHALE_TRADER_MIN_ACCOUNT_VALUE_USD: "25000"

      WHALE_SPOT_MIN_WR: "55"
      WHALE_SPOT_MIN_PF: "1.25"
      WHALE_SPOT_MIN_CLOSED_TRADES: "10"
      WHALE_SPOT_MIN_PNL_USD: "0"

      WHALE_FUTURES_EMERGING_MIN_TRADES: "5"
      WHALE_FUTURES_EMERGING_MIN_WR: "58"
      WHALE_FUTURES_EMERGING_MIN_PF: "1.5"
      WHALE_FUTURES_EMERGING_MAX_DD_PCT: "20"

      WHALE_SPOT_EMERGING_MIN_TRADES: "5"
      WHALE_SPOT_EMERGING_MIN_WR: "58"
      WHALE_SPOT_EMERGING_MIN_PF: "1.5"
      WHALE_SPOT_EMERGING_MAX_DD_PCT: "20"

      WHALE_DISCOVERY_FUTURES_ACTIVE_SELECTION: "true"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_FILLS: "5"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_VOLUME_USD: "25000"
      WHALE_DISCOVERY_FUTURES_MIN_FRESH_ADD_USD: "100"

      SIGNAL_MAX_ENTRY_DISTANCE_PCT: "0.75"
      SIGNAL_WATCH_DISTANCE_PCT: "3"
      SIGNAL_MIN_RR: "2"
      SIGNAL_SPOT_SL_PCT: "2"
      SIGNAL_SPOT_TP_PCT: "4"
      SIGNAL_FUTURES_SL_PCT: "1.5"
      SIGNAL_FUTURES_TP_PCT: "3"

      SIGNAL_SPOT_ACTIVITY_LOOKBACK_MIN: "15"
      SIGNAL_SPOT_MIN_BUY_USD: "25"
      SIGNAL_SPOT_MAX_ACTIVITY_AGE_MIN: "15"
      SIGNAL_SPOT_MAX_SIGNAL_AGE_MIN: "5"

      SIGNAL_FUTURES_ACTIVITY_LOOKBACK_MIN: "120"
      SIGNAL_FUTURES_SIGNAL_FRESHNESS_MIN: "15"
      SIGNAL_FUTURES_MIN_SIGNAL_ADD_USD: "100"
      SIGNAL_FUTURES_MIN_SIGNAL_WINDOW_NOTIONAL_USD: "100"
      SIGNAL_FUTURES_MAX_SIGNALS_PER_WALLET: "3"
      SIGNAL_FUTURES_BETWEEN_WALLETS_MS: "1200"

      SIGNAL_FUTURES_LIFECYCLE_BATCH_GAP_MIN: "3"
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_HOURS: "24"
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_MAX_PAGES: "3"

      SIGNAL_PERFORMANCE_LOOKBACK_DAYS: "30"
      SIGNAL_PERFORMANCE_CACHE_MIN: "15"
      SIGNAL_PERFORMANCE_MAX_PAGES: "8"
      SIGNAL_PERFORMANCE_PAGE_DELAY_MS: "250"
      SIGNAL_PERFORMANCE_MIN_CLOSED_TRADE_USD: "0.10"

      SIGNAL_FUTURES_REQUIRE_MARKET_CONFIRMATION: "true"
      SIGNAL_FUTURES_MIN_24H_VOLUME_USD: "1000000"

      WHALE_DISCOVERY_LOOKBACK_HOURS: "48"
      WHALE_DISCOVERY_MIN_VOLUME_USD: "250000"
      WHALE_DISCOVERY_MIN_IN_WINDOW: "3"
      WHALE_DISCOVERY_MIN_COMPLETED: "3"
      WHALE_DISCOVERY_MIN_HOLD_RATIO: "0.35"
      WHALE_DISCOVERY_MIN_HOLD_HOURS: "1"
      WHALE_DISCOVERY_MAX_HOLD_HOURS: "24"
      WHALE_DISCOVERY_MAX_CANDIDATES: "80"
      WHALE_DISCOVERY_FUTURES_QUICK_LOOKBACK_HOURS: "12"
      WHALE_DISCOVERY_FUTURES_DEEP_CANDIDATES: "30"
      WHALE_DISCOVERY_FUTURES_QUICK_MAX_PAGES: "1"
      WHALE_DISCOVERY_FUTURES_DEEP_MAX_PAGES: "8"
      WHALE_DISCOVERY_FUTURES_DEEP_DELAY_MS: "350"

      WHALE_DISCOVERY_SPOT_MIN_EVIDENCE_TRADES: "3"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUYS: "1"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUY_USD: "25"
      WHALE_DISCOVERY_SPOT_FINALISTS: "20"

      SIGNAL_TELEGRAM_DEDUP_MIN: "15"
      SIGNAL_MAX_TELEGRAM_WHALE_BLOCKS: "10"

      EXECUTION_ENABLED: "false"
      DRY_RUN: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare state directory
        shell: bash
        run: |
          set -e
          mkdir -p state
          echo "STATE DIRECTORY READY"

      - name: Verify required worker exists
        shell: bash
        run: |
          set -e
          WORKER="crypto_whale_signal_engine.mjs"
          if [ ! -f "$WORKER" ]; then
            echo "FATAL: $WORKER not found"
            ls -la
            exit 1
          fi
          echo "Worker: $WORKER"
          wc -c "$WORKER"

      - name: Verify engine version V6.3
        shell: bash
        env:
          EXPECTED_ENGINE_VERSION: "V6.3"
        run: |
          set -e
          WORKER="crypto_whale_signal_engine.mjs"
          ACTUAL_VERSION="$(node -e "const fs=require('fs');const s=fs.readFileSync(process.argv[1],'utf8');const m=s.match(/const\\s+VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/);if(!m)process.exit(2);process.stdout.write(m[1]);" "$WORKER")"
          echo "Expected: $EXPECTED_ENGINE_VERSION"
          echo "Actual:   $ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "$EXPECTED_ENGINE_VERSION" || { echo "FATAL: WRONG ENGINE VERSION"; exit 1; }
          echo "ENGINE VERSION VERIFIED: $ACTUAL_VERSION"

      - name: Node syntax check
        shell: bash
        run: |
          set -e
          node --check crypto_whale_signal_engine.mjs
          echo "PASS | node --check"

      - name: Verify V6.3 contracts
        shell: bash
        run: |
          set -e
          WORKER="crypto_whale_signal_engine.mjs"
          required_patterns=(
            "V6.3-LIFECYCLE-BATCH-RECONSTRUCTION"
            "V6.3-UNIFIED-GATE-PERFORMANCE-AUDIT"
            "V6.2-TRADE-LIFECYCLE-MARKET-TYPE-LEVERAGE-AUDIT"
            "marketType:'SPOT'"
            "marketType:'FUTURES'"
            "leverageSource:'HYPERLIQUID_CLEARINGHOUSE_STATE'"
            "NEW ENTRY"
            "ADD #"
            "unifiedGateFromPerformance"
            "FUTURES_LIFECYCLE_BATCH_GAP_MIN"
            "FUTURES_LIFECYCLE_AUDIT_HOURS"
            "FUTURES_LIFECYCLE_AUDIT_MAX_PAGES"
            "V6.1-SPOT-FIFO-PERFORMANCE-V3"
            "V6.1-SPOT-PERFORMANCE-FUTURES-RECON-AUDITED"
          )
          for pattern in "${required_patterns[@]}"; do
            grep -q "$pattern" "$WORKER" || { echo "FATAL: missing contract: $pattern"; exit 1; }
            echo "PASS | $pattern"
          done
          echo "V6.3 CONTRACTS VERIFIED"

      - name: Run V6.3 self-test
        shell: bash
        env:
          WHALE_SELF_TEST: "true"
        run: |
          set -e
          WHALE_SELF_TEST=true node crypto_whale_signal_engine.mjs
          echo "V6.3 SELF-TEST PASSED"

      - name: Print runtime safety
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.3"
          echo "========================================"
          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Orders: DISABLED"
          echo "Execution: DISABLED"
          echo "Dry Run: TRUE"
          echo "Spot target: 5"
          echo "Futures target: 5"
          echo "Unified gate: WR>=55% | PF>=1.25 | Trades>=10"
          echo "Lifecycle: NEW ENTRY -> ADD #N"
          echo "Lifecycle batch gap: 3m"
          echo "Futures leverage: live clearinghouse state"
          echo "========================================"

      - name: Run Crypto Whale Signal Engine V6.3
        shell: bash
        run: |
          set -e
          node crypto_whale_signal_engine.mjs

      - name: Persist state changes
        if: always()
        shell: bash
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            if ! git diff --cached --quiet; then
              git commit -m "chore: update whale signal engine state"
              git push
            fi
          else
            echo "No state changes to commit."
          fi
