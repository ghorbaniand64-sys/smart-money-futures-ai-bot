name: CRYPTO WHALE SIGNAL ENGINE V6.3

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine-production
  cancel-in-progress: false

jobs:
  whale-signal-engine:
    name: Crypto Whale Signal Engine V6.3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      NODE_ENV: production
      EXPECTED_ENGINE_VERSION: "V6.3"

      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      # =========================
      # READ ONLY / NO EXECUTION
      # =========================
      EXECUTION_ENABLED: "false"
      DRY_RUN: "true"

      # =========================
      # DISCOVERY — exact Worker names
      # =========================
      WHALE_TARGET_SPOT_WALLETS: "5"
      WHALE_TARGET_FUTURES_WALLETS: "5"
      WHALE_DISCOVERY_TTL_MIN: "45"
      WHALE_DISCOVERY_REFRESH_EACH_CYCLE: "false"

      WHALE_DISCOVERY_SPOT_MIN_EVIDENCE_TRADES: "10"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUYS: "2"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUY_USD: "100"
      WHALE_DISCOVERY_ALLOW_ACTIVE_FALLBACK: "true"
      WHALE_DISCOVERY_SIGNAL_READY_ONLY: "false"

      WHALE_DISCOVERY_FUTURES_ACTIVE_SELECTION: "true"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_FILLS: "5"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_VOLUME_USD: "25000"
      WHALE_DISCOVERY_FUTURES_MIN_FRESH_ADD_USD: "100"

      # =========================
      # FUTURES SIGNAL
      # =========================
      SIGNAL_FUTURES_MIN_ADD_USD: "100"
      SIGNAL_FUTURES_MIN_SIGNAL_WINDOW_NOTIONAL_USD: "100"
      SIGNAL_FUTURES_SIGNAL_FRESHNESS_MIN: "15"
      SIGNAL_FUTURES_ACTIVITY_LOOKBACK_MIN: "120"

      # =========================
      # FUTURES LIFECYCLE AUDIT
      # =========================
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_HOURS: "24"
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_MAX_PAGES: "3"
      SIGNAL_FUTURES_LIFECYCLE_BATCH_MIN: "3"
      FUTURES_LIFECYCLE_AUDIT_HOURS: "24"
      FUTURES_LIFECYCLE_AUDIT_MAX_PAGES: "3"

      # =========================
      # SPOT SIGNAL
      # =========================
      SIGNAL_SPOT_MIN_BUY_USD: "25"
      SIGNAL_SPOT_ACTIVITY_LOOKBACK_MIN: "15"
      SIGNAL_SPOT_MAX_ACTIVITY_AGE_MIN: "15"
      SIGNAL_MAX_LATENCY_MIN: "5"

      # =========================
      # RISK / RR
      # =========================
      SIGNAL_SPOT_SL_PCT: "2"
      SIGNAL_SPOT_TP_PCT: "4"
      SIGNAL_FUTURES_SL_PCT: "1.5"
      SIGNAL_FUTURES_TP_PCT: "3"
      SIGNAL_MAX_ENTRY_DISTANCE_PCT: "0.75"
      SIGNAL_WATCH_DISTANCE_PCT: "3"
      SIGNAL_MIN_RR: "2"

      # =========================
      # UNIFIED GATE — exact V6.3 aliases
      # =========================
      TRADER_MIN_CLOSED_TRADES: "10"
      TRADER_MIN_WR: "55"
      TRADER_MIN_PF: "1.25"

      SPOT_TRADER_MIN_CLOSED_TRADES: "10"
      SPOT_TRADER_MIN_WR: "55"
      SPOT_TRADER_MIN_PF: "1.25"

      # Keep legacy Worker aliases synchronized with the same gate.
      WHALE_TRADER_MIN_CLOSED_TRADES: "10"
      WHALE_TRADER_MIN_WR: "55"
      WHALE_TRADER_MIN_PF: "1.25"
      WHALE_SPOT_MIN_CLOSED_TRADES: "10"
      WHALE_SPOT_MIN_WR: "55"
      WHALE_SPOT_MIN_PF: "1.25"

      # =========================
      # PERFORMANCE
      # =========================
      SIGNAL_PERFORMANCE_LOOKBACK_DAYS: "30"
      SIGNAL_PERFORMANCE_CACHE_MIN: "15"
      SIGNAL_PERFORMANCE_MIN_CLOSED_TRADE_USD: "1"
      PERFORMANCE_LOOKBACK_DAYS: "30"
      PERFORMANCE_CACHE_MIN: "15"
      PERFORMANCE_MIN_CLOSED_TRADE_USD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify worker file
        shell: bash
        run: |
          set -e
          test -f crypto_whale_signal_engine.mjs
          echo "PASS | crypto_whale_signal_engine.mjs exists"

      - name: Verify engine version
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "ENGINE VERSION"
          echo "========================================"

          ACTUAL_VERSION=$(grep -E "const VERSION = ['\"]" crypto_whale_signal_engine.mjs \
            | head -n 1 \
            | sed -E "s/.*const VERSION = ['\"]([^'\"]+)['\"].*/\1/")

          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FATAL: VERSION constant not found"
            exit 1
          fi

          echo "Expected: ${EXPECTED_ENGINE_VERSION}"
          echo "Actual:   ${ACTUAL_VERSION}"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_ENGINE_VERSION" ]; then
            echo "FATAL: engine version mismatch"
            exit 1
          fi

          echo "PASS | engine version ${ACTUAL_VERSION}"

      - name: Node syntax check
        shell: bash
        run: |
          set -e
          node --check crypto_whale_signal_engine.mjs
          echo "PASS | node --check"

      - name: V6.3 contract verification
        shell: bash
        run: |
          set -e
          WORKER="crypto_whale_signal_engine.mjs"

          echo "========================================"
          echo "V6.3 CONTRACT VERIFICATION"
          echo "========================================"

          required_patterns=(
            "const VERSION = 'V6.3'"
            "V6.1-SPOT-FIFO-PERFORMANCE-V3"
            "V6.1-SPOT-PERFORMANCE-FUTURES-RECON-AUDITED"
            "V6.2-TRADE-LIFECYCLE-MARKET-TYPE-LEVERAGE-AUDIT"
            "V6.3-TRADE-LIFECYCLE-MARKET-TYPE-LEVERAGE-UNIFIED-GATE"
            "FUTURES_LIFECYCLE_AUDIT_HOURS"
            "FUTURES_LIFECYCLE_AUDIT_MAX_PAGES"
            "marketType:'FUTURES'"
            "marketType:'SPOT'"
            "leverageSource:'HYPERLIQUID_CLEARINGHOUSE_STATE'"
            "TRADER_MIN_CLOSED_TRADES"
            "TRADER_MIN_WR"
            "TRADER_MIN_PF"
            "SPOT_TRADER_MIN_CLOSED_TRADES"
            "SPOT_TRADER_MIN_WR"
            "SPOT_TRADER_MIN_PF"
          )

          for pattern in "${required_patterns[@]}"; do
            if ! grep -Fq "$pattern" "$WORKER"; then
              echo "FATAL: missing V6.3 contract: $pattern"
              exit 1
            fi
            echo "PASS | $pattern"
          done

          echo "PASS | V6.3 CONTRACT VERIFICATION"

      - name: V6.3 self test
        shell: bash
        env:
          WHALE_SELF_TEST: "true"
          EXECUTION_ENABLED: "false"
          DRY_RUN: "true"
        run: |
          set -e
          node crypto_whale_signal_engine.mjs
          echo "PASS | V6.3 SELF TEST"

      - name: Run Crypto Whale Signal Engine V6.3
        shell: bash
        env:
          WHALE_SELF_TEST: "false"
          EXECUTION_ENABLED: "false"
          DRY_RUN: "true"
        run: |
          set -e
          echo "========================================"
          echo "STARTING CRYPTO WHALE SIGNAL ENGINE V6.3"
          echo "========================================"
          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Orders: DISABLED"
          echo "Execution: DISABLED"
          node crypto_whale_signal_engine.mjs
          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.3 FINISHED"
          echo "========================================"

      - name: Persist state changes
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update whale signal engine state"

          # Synchronize with the newest main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "PASS | STATE PUSHED"

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.3"
          echo "========================================"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID:   ${{ github.run_id }}"
          echo "Mode:     READ-ONLY / SIGNAL-ONLY"
          echo "Orders:   DISABLED"
          echo "========================================"
