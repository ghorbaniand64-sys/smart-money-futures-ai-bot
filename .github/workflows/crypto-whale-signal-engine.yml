name: Global Futures Top-Trader & Signal Hunter

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gftsh-production
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify worker contract
        shell: bash
        run: |
          set -euo pipefail
          test -f crypto_whale_signal_engine.mjs
          node --check crypto_whale_signal_engine.mjs
          grep -q "GFTSH-V1.1.0-GLOBAL-FUTURES-MULTI-VENUE" crypto_whale_signal_engine.mjs
          if grep -Eiq 'HELIUS|SOLANA_RPC|SPOT|JUPITER|RAYDIUM|PUMPFUN' crypto_whale_signal_engine.mjs; then
            echo 'FATAL: forbidden legacy Spot/Solana/Helius code detected'
            exit 1
          fi
          echo 'PASS | GFTSH V1.1 worker contract'

      - name: Run global futures hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GFTSH_DISCOVERY_LIMIT: '250'
          GFTSH_VERIFY_LIMIT: '150'
          GFTSH_TOP_SIGNALS: '10'
          GFTSH_FRESH_MIN: '15'
          GFTSH_ENTRY_MAX_PCT: '0.5'
          GFTSH_MIN_RR: '1.5'
          GFTSH_MIN_7D_TRADES: '30'
          GFTSH_MIN_ACTIVE_DAYS: '4'
          GFTSH_MIN_WR: '55'
          GFTSH_MIN_PF: '1.5'
          GFTSH_MAX_MEDIAN_HOURS: '4'
          GFTSH_MAX_AVG_HOURS: '8'
          GFTSH_MAX_DD: '40'
          GFTSH_MODEL_SL_PCT: '0.5'
          GFTSH_MODEL_TP_R: '2'
          GFTSH_HL_VERIFY_CONCURRENCY: '8'
          GFTSH_HTTP_TIMEOUT_MS: '12000'
        run: node crypto_whale_signal_engine.mjs

      - name: Persist state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d state ] && [ -n "$(git status --porcelain state 2>/dev/null || true)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state
            git commit -m 'chore: update GFTSH global futures state' || true
            git push || true
          fi
