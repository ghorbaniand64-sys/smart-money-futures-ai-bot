name: Crypto Whale Signal Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

  # ─────────────────────────────────────────────
  # GFTSH — V3.2 GLOBAL FUTURES HUNTER
  # ─────────────────────────────────────────────
  GFTSH_HL_AUDIT_LIMIT: '100'
  GFTSH_VERIFY_CONCURRENCY: '2'
  GFTSH_VERIFY_TIMEOUT_MS: '8500'
  GFTSH_TOP_SIGNALS: '10'
  GFTSH_FRESH_MIN: '15'
  GFTSH_ENTRY_MAX_PCT: '0.5'
  GFTSH_MIN_RR: '1.5'
  GFTSH_MODEL_SL_PCT: '0.5'
  GFTSH_MODEL_TP_R: '2'

  # Historical quality gates
  GFTSH_MIN_7D_TRADES: '40'
  GFTSH_MIN_ACTIVE_DAYS: '5'
  GFTSH_MIN_AVG_DAILY_TRADES: '4'
  GFTSH_MIN_WR: '58'
  GFTSH_MIN_PF: '1.8'
  GFTSH_MAX_MEDIAN_HOURS: '6'
  GFTSH_MAX_AVG_HOURS: '12'
  GFTSH_MAX_DD: '30'

  # ─────────────────────────────────────────────
  # V3.2 PERSISTENT GLOBAL BEHAVIOR DISCOVERY
  # ─────────────────────────────────────────────
  GFTSH_BEHAVIOR_STATE_FILE: 'state/gftsh_global_behavior_v23.json'
  GFTSH_PERSIST_DIR: 'state'
  GFTSH_STATE_SNAPSHOT: 'state/gftsh_global_behavior_snapshot.json'

  GFTSH_GLOBAL_MIN_REPEAT_EVENTS: '3'
  GFTSH_GLOBAL_MIN_PREPUMP_LEAD_MIN: '10'
  GFTSH_GLOBAL_EXIT_CAPTURE_MIN: '70'
  GFTSH_GLOBAL_EXIT_PEAK_TOLERANCE_MIN: '15'
  GFTSH_GLOBAL_MIN_DISTINCT_COINS: '2'
  GFTSH_GLOBAL_TRACKED_HUNTERS: '10'

  # 40 traders per cycle = controlled full-universe rotation
  GFTSH_GLOBAL_DISCOVERY_AUDIT_CHUNK: '40'
  GFTSH_GLOBAL_ROTATION_POOL: '0'
  GFTSH_GLOBAL_DISCOVERY_REFRESH_HOURS: '24'
  GFTSH_PERSIST_HEARTBEAT_MIN: '15'

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:

      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      # ─────────────────────────────────────────────
      # 2. NODE 22
      # ─────────────────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # ─────────────────────────────────────────────
      # 3. ENSURE PERSISTENT STATE DIRECTORY
      # ─────────────────────────────────────────────
      - name: Ensure state directory
        run: |
          mkdir -p state
          echo "State directory:"
          ls -lah state || true

      # ─────────────────────────────────────────────
      # 4. RUN V3.2 GLOBAL FUTURES HUNTER
      # ─────────────────────────────────────────────
      - name: Run GFTSH V3.2 Global Futures Hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Explicit V3.2 persistent state paths
          GFTSH_BEHAVIOR_STATE_FILE: state/gftsh_global_behavior_v23.json
          GFTSH_PERSIST_DIR: state
          GFTSH_STATE_SNAPSHOT: state/gftsh_global_behavior_snapshot.json

        run: |
          echo "=============================================="
          echo "GFTSH V3.2 — GLOBAL FUTURES HUNTER"
          echo "=============================================="
          echo "State before run:"
          ls -lah state || true
          echo "----------------------------------------------"

          node crypto_whale_signal_engine.mjs

          echo "----------------------------------------------"
          echo "State after run:"
          ls -lah state || true
          echo "=============================================="

      # ─────────────────────────────────────────────
      # 5. VERIFY STATE WAS ACTUALLY WRITTEN
      # ─────────────────────────────────────────────
      - name: Verify GFTSH persistent state
        run: |
          echo "Checking GFTSH state files..."

          test -f state/gftsh_global_behavior_v23.json
          test -f state/gftsh_global_behavior_snapshot.json

          echo "✓ gftsh_global_behavior_v23.json exists"
          echo "✓ gftsh_global_behavior_snapshot.json exists"

          echo "State sizes:"
          wc -c \
            state/gftsh_global_behavior_v23.json \
            state/gftsh_global_behavior_snapshot.json

      # ─────────────────────────────────────────────
      # 6. COMMIT PERSISTENT GFTSH STATE
      # ─────────────────────────────────────────────
      - name: Commit GFTSH persistent state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/gftsh_global_behavior_v23.json
          git add state/gftsh_global_behavior_snapshot.json

          # Also preserve legacy state files if they still exist.
          git add state/global_futures_hunter.json 2>/dev/null || true
          git add state/global_futures_cache.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: persist GFTSH V3.2 behavior state"

      # ─────────────────────────────────────────────
      # 7. PUSH STATE BACK TO REPOSITORY
      # ─────────────────────────────────────────────
      - name: Push persistent GFTSH state
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
