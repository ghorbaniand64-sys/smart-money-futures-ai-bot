name: Global Futures Top Trader & Signal Hunter

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  EXECUTION_ENABLED: 'false'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify worker
        shell: bash
        run: |
          set -e
          test -f crypto_whale_signal_engine.mjs
          node --check crypto_whale_signal_engine.mjs
          grep -q 'GFTSH-V1.6.0-GLOBAL-FUTURES-RATE-LIMIT-AUDIT' crypto_whale_signal_engine.mjs

      - name: Run GFTSH V1.6
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GFTSH_HL_VERIFY_LIMIT: '120'
          GFTSH_OKX_VERIFY_LIMIT: '120'
          GFTSH_VERIFY_LIMIT: '240'
          GFTSH_MAX_RETRIES: '3'
          GFTSH_HL_REQ_GAP_MS: '120'
          GFTSH_OKX_REQ_GAP_MS: '450'
        run: |
          set -e
          node crypto_whale_signal_engine.mjs
