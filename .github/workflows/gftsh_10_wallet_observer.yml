name: GFTSH 10 Wallet Observer

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: gftsh-10-wallet-observer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scheduler diagnostics
        run: |
          echo "========================================"
          echo "GFTSH 10 WALLET OBSERVER"
          echo "Schedule: every 5 minutes"
          echo "Cron: */5 * * * *"
          echo "UTC now: $(date -u)"
          echo "========================================"

      - name: Verify repository
        run: |
          pwd
          echo "Files:"
          ls -la
          echo
          echo "Workflow files:"
          ls -la .github/workflows || true
          echo
          echo "Observer:"
          ls -la gftsh_10_wallet_observer.mjs

      - name: Verify observer installation
        run: |
          test -f gftsh_10_wallet_observer.mjs
          node --check gftsh_10_wallet_observer.mjs

      - name: Prepare state directory
        run: |
          mkdir -p production/state
          echo "State directory:"
          ls -la production/state

      - name: Observer configuration
        run: |
          echo "========================================"
          echo "GFTSH OBSERVER CONFIG"
          echo "Wallet count: 10"
          echo "Scan interval: 5 minutes"
          echo "Lookback: worker default"
          echo "Read-only: YES"
          echo "Orders: NO"
          echo "Copy trading: NO"
          echo "========================================"

      - name: Run GFTSH observer
        env:
          GFTSH_SCAN_INTERVAL_MIN: '5'
          GFTSH_LOOKBACK_MIN: ${{ vars.GFTSH_LOOKBACK_MIN }}
          GFTSH_WATCH_WALLETS: ${{ vars.GFTSH_WATCH_WALLETS }}
          GFTSH_MIN_ALERT_NOTIONAL: ${{ vars.GFTSH_MIN_ALERT_NOTIONAL }}

          HYPERLIQUID_API_URL: ${{ vars.HYPERLIQUID_API_URL }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          echo "Starting GFTSH..."
          echo "Scan interval: 5 minutes"
          echo "Start UTC: $(date -u)"

          node gftsh_10_wallet_observer.mjs

          echo "End UTC: $(date -u)"

      - name: Inspect observer state
        if: always()
        run: |
          echo "========================================"
          echo "OBSERVER STATE"
          echo "========================================"

          if [ -f production/state/gftsh_10_wallet_observer.json ]; then
            cat production/state/gftsh_10_wallet_observer.json
          else
            echo "Observer state file not found."
          fi

          echo
          echo "Telegram state:"

          if [ -f production/state/gftsh_10_wallet_telegram.json ]; then
            cat production/state/gftsh_10_wallet_telegram.json
          else
            echo "Telegram state file not found."
          fi

      - name: Commit and push state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add production/state/gftsh_10_wallet_observer.json \
                  production/state/gftsh_10_wallet_telegram.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update GFTSH observer state"
            git push
          fi

      - name: Final summary
        if: always()
        run: |
          echo "========================================"
          echo "GFTSH 10 WALLET OBSERVER FINISHED"
          echo "Mode: READ ONLY"
          echo "Wallets: 10"
          echo "Schedule: every 5 minutes"
          echo "Orders: NO"
          echo "Copy trading: NO"
          echo "UTC: $(date -u)"
          echo "========================================"
