name: GFTSH 10 Wallet Observer

on:
schedule:
- cron: '*/10 * * * *'
workflow_dispatch:

permissions:
contents: write

concurrency:
group: gftsh-10-wallet-observer
cancel-in-progress: false

jobs:
watch:
runs-on: ubuntu-latest
environment: production

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      persist-credentials: true
      fetch-depth: 1

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Verify observer installation
    shell: bash
    run: |
      set -e
      echo "Checking observer file..."
      test -f gftsh_10_wallet_observer.mjs
      node --check gftsh_10_wallet_observer.mjs
      echo "Observer syntax check passed."

  - name: Ensure state directory
    run: mkdir -p production/state

  - name: Run 10-wallet observer
    shell: bash
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HYPERLIQUID_API_URL: ${{ vars.HYPERLIQUID_API_URL }}

      GFTSH_SCAN_INTERVAL_MIN: '10'
      GFTSH_LOOKBACK_MIN: ${{ vars.GFTSH_LOOKBACK_MIN }}
      GFTSH_REQUEST_GAP_MS: ${{ vars.GFTSH_REQUEST_GAP_MS }}
      GFTSH_REQUEST_TIMEOUT_MS: ${{ vars.GFTSH_REQUEST_TIMEOUT_MS }}
      GFTSH_RETRIES: ${{ vars.GFTSH_RETRIES }}
      GFTSH_RETRY_BASE_MS: ${{ vars.GFTSH_RETRY_BASE_MS }}

      GFTSH_WATCH_STATE_FILE: production/state/gftsh_10_wallet_observer.json
      GFTSH_WATCH_TELEGRAM_STATE_FILE: production/state/gftsh_10_wallet_telegram.json

      GFTSH_MODEL_SL_PCT: ${{ vars.GFTSH_MODEL_SL_PCT }}
      GFTSH_MODEL_TP_R: ${{ vars.GFTSH_MODEL_TP_R }}
      GFTSH_MIN_ALERT_NOTIONAL_USD: ${{ vars.GFTSH_MIN_ALERT_NOTIONAL_USD }}
      GFTSH_TELEGRAM_MAX_CHARS: ${{ vars.GFTSH_TELEGRAM_MAX_CHARS }}
      GFTSH_SEND_STARTUP_STATUS: ${{ vars.GFTSH_SEND_STARTUP_STATUS }}
      GFTSH_WATCH_WALLETS: ${{ vars.GFTSH_WATCH_WALLETS }}

    run: |
      echo "======================================"
      echo "GFTSH 10 WALLET OBSERVER"
      echo "Schedule: every 10 minutes"
      echo "Mode: READ-ONLY"
      echo "Orders: DISABLED"
      echo "Auto-copy: DISABLED"
      echo "======================================"
      node gftsh_10_wallet_observer.mjs

  - name: Persist observer state
    if: always()
    shell: bash
    run: |
      set -e
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      mkdir -p production/state

      git add -f production/state/gftsh_10_wallet_observer.json 2>/dev/null || true
      git add -f production/state/gftsh_10_wallet_telegram.json 2>/dev/null || true

      if git diff --cached --quiet; then
        echo "No state changes to commit."
        exit 0
      fi

      git commit -m "chore: persist GFTSH observer state"
      git push origin HEAD:${GITHUB_REF_NAME}

  - name: Final summary
    if: always()
    run: |
      echo "Workflow: GFTSH 10 Wallet Observer"
      echo "Schedule: every 10 minutes"
      echo "Status: ${{ job.status }}"
```
