name: GFTSH 10 Wallet Observer

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gftsh-10-wallet-observer
  cancel-in-progress: false

jobs:
  watch:
    name: Observe 10 wallets
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify observer
        shell: bash
        run: |
          set -e
          if [ ! -f "gftsh_10_wallet_observer.mjs" ]; then
            echo "::error::gftsh_10_wallet_observer.mjs not found in repository root"
            exit 1
          fi
          node --check gftsh_10_wallet_observer.mjs
          mkdir -p production/state

      - name: Show scheduler configuration
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "UTC time:"
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "Schedule: */10 * * * *"
          echo "Observer interval: 10 minutes"

      - name: Run 10-wallet observer
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          HYPERLIQUID_API_URL: ${{ vars.HYPERLIQUID_API_URL }}

          GFTSH_SCAN_INTERVAL_MIN: '10'
          GFTSH_LOOKBACK_MIN: ${{ vars.GFTSH_LOOKBACK_MIN }}
          GFTSH_REQUEST_GAP_MS: ${{ vars.GFTSH_REQUEST_GAP_MS }}
          GFTSH_REQUEST_TIMEOUT_MS: ${{ vars.GFTSH_REQUEST_TIMEOUT_MS }}
          GFTSH_RETRIES: ${{ vars.GFTSH_RETRIES }}
          GFTSH_RETRY_BASE_MS: ${{ vars.GFTSH_RETRY_BASE_MS }}

          GFTSH_WATCH_STATE_FILE: production/state/gftsh_10_wallet_observer.json
          GFTSH_WATCH_TELEGRAM_STATE_FILE: production/state/gftsh_10_wallet_telegram.json

          GFTSH_MODEL_SL_PCT: ${{ vars.GFTSH_MODEL_SL_PCT }}
          GFTSH_MODEL_TP_R: ${{ vars.GFTSH_MODEL_TP_R }}

          GFTSH_MIN_ALERT_NOTIONAL_USD: ${{ vars.GFTSH_MIN_ALERT_NOTIONAL_USD }}
          GFTSH_TELEGRAM_MAX_CHARS: ${{ vars.GFTSH_TELEGRAM_MAX_CHARS }}
          GFTSH_SEND_STARTUP_STATUS: ${{ vars.GFTSH_SEND_STARTUP_STATUS }}
          GFTSH_WATCH_WALLETS: ${{ vars.GFTSH_WATCH_WALLETS }}

        run: |
          set -e
          echo "Starting GFTSH 10 Wallet Observer..."
          node gftsh_10_wallet_observer.mjs

      - name: Persist observer state
        if: always()
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p production/state

          if [ -f "production/state/gftsh_10_wallet_observer.json" ]; then
            git add -f production/state/gftsh_10_wallet_observer.json
          fi

          if [ -f "production/state/gftsh_10_wallet_telegram.json" ]; then
            git add -f production/state/gftsh_10_wallet_telegram.json
          fi

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: persist GFTSH observer state"

          # Refresh the target branch before pushing persisted state.
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "GFTSH 10 WALLET OBSERVER"
          echo "Event: ${{ github.event_name }}"
          echo "Run number: ${{ github.run_number }}"
          echo "Job status: ${{ job.status }}"
          echo "UTC time:"
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "=========================================="
```
