name: Crypto Whale Signal Engine

on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-whale-signal-engine
  cancel-in-progress: true

jobs:
  signal-engine:
    name: Run Crypto Whale Signal Engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify signal engine
        run: |
          set -e

          test -f crypto_whale_signal_engine.mjs

          echo "Checking Node.js syntax..."
          node --check crypto_whale_signal_engine.mjs

          echo "Signal engine file:"
          ls -lh crypto_whale_signal_engine.mjs

          echo "Signal engine verification: OK"

      - name: Verify old execution engine is absent
        run: |
          set -e

          if [ -f hyperliquid_execution_engine.mjs ]; then
            echo "ERROR: old execution engine exists"
            echo "Remove hyperliquid_execution_engine.mjs from the repository."
            exit 1
          fi

          echo "Old execution engine: ABSENT"

      - name: Verify required secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "ERROR: TELEGRAM_TOKEN secret is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is missing"
            exit 1
          fi

          echo "Telegram secrets: OK"

      - name: Run signal engine
        env:
          HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          SIGNAL_MAX_ENTRY_DISTANCE_PCT: "0.75"
          SIGNAL_MIN_RR: "2.0"

          SIGNAL_SPOT_SL_PCT: "2.0"
          SIGNAL_SPOT_TP_PCT: "4.0"

          SIGNAL_FUTURES_SL_PCT: "1.5"
          SIGNAL_FUTURES_TP_PCT: "3.0"

          SIGNAL_SPOT_SIGNATURES: "30"
          SIGNAL_MAX_SPOT_POSITIONS_PER_WALLET: "5"

          SIGNAL_REQUEST_TIMEOUT_MS: "20000"

        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE"
          echo "========================================"
          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Worker: crypto_whale_signal_engine.mjs"
          echo "No orders"
          echo "No execution"
          echo "No leverage changes"
          echo "========================================"

          node crypto_whale_signal_engine.mjs
