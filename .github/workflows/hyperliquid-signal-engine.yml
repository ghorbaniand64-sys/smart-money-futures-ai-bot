name: Crypto Whale Signal Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine
  cancel-in-progress: false

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      # ========================================
      # PRODUCTION SECRETS
      # ========================================
      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      # ========================================
      # RUNTIME
      # ========================================
      NODE_OPTIONS: "--max-old-space-size=4096"
      SIGNAL_ENGINE_MODE: "READ_ONLY"
      EXECUTION_ENABLED: "false"

      # ========================================
      # WATCHLIST TARGETS
      # ========================================
      SIGNAL_SPOT_TARGET: "5"
      SIGNAL_FUTURES_TARGET: "5"

      SIGNAL_HOLD_MIN_HOURS: "1"
      SIGNAL_HOLD_MAX_HOURS: "24"

      # ========================================
      # DISCOVERY
      # ========================================
      WHALE_DISCOVERY_TTL_MIN: "360"
      WHALE_DISCOVERY_LOOKBACK_HOURS: "48"

      WHALE_DISCOVERY_MIN_HOLD_HOURS: "1"
      WHALE_DISCOVERY_MAX_HOLD_HOURS: "24"
      WHALE_DISCOVERY_MIN_VOLUME_USD: "250000"
      WHALE_DISCOVERY_MIN_COMPLETED: "3"
      WHALE_DISCOVERY_MIN_IN_WINDOW: "5"
      WHALE_DISCOVERY_MIN_HOLD_RATIO: "0.5"
      WHALE_DISCOVERY_MIN_RECENT_LIFECYCLES: "1"
      WHALE_DISCOVERY_MAX_CANDIDATES: "30"

      # ========================================
      # V5.8 / V5.9 SIGNAL-READY DISCOVERY
      # ========================================
      WHALE_DISCOVERY_SIGNAL_READY_ONLY: "true"

      WHALE_DISCOVERY_FUTURES_SIGNAL_READY_MIN_AGE_MIN: "15"
      WHALE_DISCOVERY_FUTURES_SIGNAL_READY_MIN_ADD_USD: "100"

      WHALE_DISCOVERY_SPOT_SIGNAL_READY_LOOKBACK_MIN: "15"
      WHALE_DISCOVERY_SPOT_SIGNAL_READY_MIN_BUY_USD: "25"

      # ========================================
      # SPOT DISCOVERY
      # ========================================
      WHALE_DISCOVERY_SPOT_PROGRAM_SIGS: "8"
      WHALE_DISCOVERY_SPOT_PROGRAM_TXS: "4"
      WHALE_DISCOVERY_SPOT_TOP_TOKENS: "20"
      WHALE_DISCOVERY_SPOT_TOP_HOLDERS: "8"
      WHALE_DISCOVERY_SPOT_MAX_CANDIDATES: "8"
      WHALE_DISCOVERY_SPOT_TOKEN_COUNT: "8"
      WHALE_DISCOVERY_SPOT_HOLDER_COUNT: "5"
      WHALE_DISCOVERY_SPOT_CANDIDATE_WALLETS: "16"
      WHALE_DISCOVERY_SPOT_TX_LIMIT: "30"
      WHALE_DISCOVERY_SPOT_FINALISTS: "12"

      # ========================================
      # FUTURES DISCOVERY
      # ========================================
      WHALE_DISCOVERY_FUTURES_QUICK_LOOKBACK_HOURS: "12"
      WHALE_DISCOVERY_FUTURES_DEEP_CANDIDATES: "15"
      WHALE_DISCOVERY_FUTURES_QUICK_MAX_PAGES: "1"
      WHALE_DISCOVERY_FUTURES_DEEP_MAX_PAGES: "8"
      WHALE_DISCOVERY_FUTURES_DEEP_DELAY_MS: "350"

      # ========================================
      # FILL / RPC
      # ========================================
      WHALE_DISCOVERY_FILL_PAGE_SIZE: "2000"
      WHALE_DISCOVERY_FILL_MAX_PAGES: "8"

      WHALE_DISCOVERY_RPC_DELAY_MS: "1800"
      WHALE_DISCOVERY_RPC_RETRIES: "5"
      WHALE_DISCOVERY_RPC_FAST_RETRIES: "2"
      WHALE_DISCOVERY_RPC_FAST_DELAY_MS: "700"

      DISCOVERY_FILL_PAGE_SIZE: "2000"
      DISCOVERY_FILL_MAX_PAGES: "8"

      # ========================================
      # SIGNAL RULES
      # ========================================
      SIGNAL_ENTRY_WINDOW_PCT: "0.75"
      SIGNAL_WATCH_WINDOW_PCT: "3.0"
      SIGNAL_MIN_RR: "2.0"
      SIGNAL_MAX_LATENCY_MIN: "5"

      # ========================================
      # SPOT SIGNAL
      # ========================================
      SIGNAL_SPOT_ACTIVITY_LOOKBACK_MIN: "15"
      SIGNAL_SPOT_MAX_ACTIVITY_AGE_MIN: "15"
      SIGNAL_SPOT_SIGNATURES: "80"
      SIGNAL_SPOT_MIN_BUY_USD: "25"

      SIGNAL_SPOT_SL_PCT: "2.0"
      SIGNAL_SPOT_TP_PCT: "4.0"

      SIGNAL_SPOT_DIAGNOSTIC_MAX: "5"
      SIGNAL_MAX_SPOT_POSITIONS_PER_WALLET: "4"

      # ========================================
      # FUTURES SIGNAL
      # ========================================
      SIGNAL_FUTURES_ACTIVITY_LOOKBACK_MIN: "120"
      SIGNAL_FUTURES_SIGNAL_FRESHNESS_MIN: "15"

      SIGNAL_FUTURES_GREEN_LATENCY_MIN: "5"
      SIGNAL_FUTURES_AVERAGING_GREEN_LATENCY_MIN: "10"

      SIGNAL_FUTURES_MIN_MEANINGFUL_ADD_NOTIONAL_USD: "100"

      SIGNAL_FUTURES_SL_PCT: "1.5"
      SIGNAL_FUTURES_TP_PCT: "3.0"

      SIGNAL_FUTURES_MAX_ACTIVE_LIFECYCLE_AGE_HOURS: "24"
      SIGNAL_FUTURES_MAX_ADVERSE_AVG_PCT: "5"

      SIGNAL_FUTURES_AUDIT_LOOKBACK_MIN: "1440"

      SIGNAL_FUTURES_BETWEEN_WALLETS_MS: "1200"
      SIGNAL_FUTURES_RETRY_BASE_MS: "1500"
      SIGNAL_FUTURES_FETCH_RETRY: "5"

      # ========================================
      # TELEGRAM / PERFORMANCE
      # ========================================
      SIGNAL_MAX_TELEGRAM_WHALE_BLOCKS: "10"

      SIGNAL_PERFORMANCE_LOOKBACK_DAYS: "30"
      SIGNAL_PERFORMANCE_CACHE_MIN: "15"
      SIGNAL_PERFORMANCE_MAX_PAGES: "8"
      SIGNAL_PERFORMANCE_PAGE_DELAY_MS: "250"

      SIGNAL_PERFORMANCE_STATE_FILE: "state/whale_performance_cache.json"

      # ========================================
      # STATE
      # ========================================
      SIGNAL_WATCHLIST_STATE_FILE: "state/whale_watchlist.json"
      WHALE_DISCOVERY_STATE_FILE: "state/whale_watchlist.json"

    steps:

      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================
      # NODE 22
      # ========================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ========================================
      # ENVIRONMENT AUDIT
      # ========================================
      - name: Environment audit
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE"
          echo "ENVIRONMENT AUDIT"
          echo "========================================"

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Repository:"
          pwd

          echo
          echo "Git:"
          git rev-parse --short HEAD

          echo
          echo "Required engine:"
          test -f crypto_whale_signal_engine.mjs
          echo "crypto_whale_signal_engine.mjs = FOUND"

          echo
          echo "Workflow directory:"
          if [ -d ".github/workflows" ]; then
            echo ".github/workflows = FOUND"
            echo
            echo "Workflow files:"
            find .github/workflows -maxdepth 1 -type f -print || true
          else
            echo "WARNING: .github/workflows directory not found."
            echo "Continuing because workflow file existence is not required"
            echo "for execution of the engine."
          fi

          echo
          echo "ENVIRONMENT AUDIT: PASS"

      # ========================================
      # V5.9 VERSION VERIFICATION
      # ========================================
      - name: VERIFY ENGINE VERSION
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ENGINE VERSION VERIFICATION"
          echo "========================================"

          echo
          echo "VERSION declarations:"

          grep -nE "const VERSION|DISCOVERY_SCHEMA|V5\.[0-9]" \
            crypto_whale_signal_engine.mjs || true

          echo
          echo "Expected:"
          echo "V5.9"

          if ! grep -q "V5.9" crypto_whale_signal_engine.mjs; then
            echo
            echo "========================================"
            echo "FATAL: WRONG ENGINE VERSION"
            echo "========================================"
            echo
            echo "The repository does not contain V5.9."
            echo "Execution stopped."
            echo
            exit 1
          fi

          echo
          echo "VERSION CHECK: PASS"

      # ========================================
      # V5.9 LOGIC AUDIT
      # ========================================
      - name: VERIFY V5.9 LOGIC
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "V5.9 LOGIC AUDIT"
          echo "========================================"

          FAIL=0

          check_pattern() {
            NAME="$1"
            PATTERN="$2"

            if grep -q "$PATTERN" crypto_whale_signal_engine.mjs; then
              echo "PASS | $NAME"
            else
              echo "FAIL | $NAME"
              FAIL=1
            fi
          }

          check_pattern "V5.9 marker" "V5.9"
          check_pattern "Discovery schema" "DISCOVERY_SCHEMA"

          check_pattern \
            "Futures freshness rule" \
            "FUTURES_SIGNAL_FRESHNESS_MIN"

          check_pattern \
            "Meaningful Futures ADD rule" \
            "FUTURES_MIN_MEANINGFUL_ADD_NOTIONAL_USD"

          check_pattern \
            "Spot minimum BUY rule" \
            "SPOT_MIN_BUY_USD"

          check_pattern \
            "Signal-ready discovery" \
            "DISCOVERY_SIGNAL_READY_ONLY"

          check_pattern \
            "Futures signal-ready minimum ADD" \
            "DISCOVERY_FUTURES_SIGNAL_READY_MIN_ADD_USD"

          check_pattern \
            "Spot signal-ready lookback" \
            "DISCOVERY_SPOT_SIGNAL_READY_LOOKBACK_MIN"

          check_pattern \
            "Spot price validation" \
            "baseToken"

          check_pattern \
            "Performance fallback" \
            "userFills"

          check_pattern \
            "Watchlist state" \
            "whale_watchlist.json"

          if [ "$FAIL" -ne 0 ]; then
            echo
            echo "========================================"
            echo "FATAL: V5.9 LOGIC AUDIT FAILED"
            echo "========================================"
            exit 1
          fi

          echo
          echo "V5.9 LOGIC AUDIT: PASS"

      # ========================================
      # NODE SYNTAX
      # ========================================
      - name: Node syntax check
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "NODE SYNTAX CHECK"
          echo "========================================"

          node --check crypto_whale_signal_engine.mjs

          echo
          echo "NODE CHECK: PASS"

      # ========================================
      # STATE DIRECTORY
      # ========================================
      - name: Prepare state directory
        shell: bash
        run: |
          set -e

          mkdir -p state
          touch state/.gitkeep

          echo "========================================"
          echo "STATE DIRECTORY"
          echo "========================================"

          echo
          echo "Existing state files:"

          find state -maxdepth 1 -type f -print 2>/dev/null || true

      # ========================================
      # RUN ENGINE
      # ========================================
      - name: Run Crypto Whale Signal Engine V5.9
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V5.9"
          echo "========================================"

          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Orders: DISABLED"
          echo "Execution: DISABLED"

          echo
          echo "Watchlist:"
          echo "Spot target: 5"
          echo "Futures target: 5"

          echo
          echo "Discovery:"
          echo "Signal-ready discovery: ENABLED"
          echo "Futures fresh ADD minimum: \$100"
          echo "Futures freshness: <= 15m"
          echo "Spot BUY minimum: \$25"
          echo "Spot freshness: <= 15m"

          echo
          echo "Signal rules:"
          echo "Entry distance: <= 0.75%"
          echo "Watch distance: <= 3%"
          echo "Minimum RR: 2.0"
          echo "Freshness: <= 15m"

          echo
          echo "Execution:"
          echo "NO ORDERS"
          echo "NO POSITION CHANGES"
          echo "NO LEVERAGE CHANGES"

          echo "========================================"

          node crypto_whale_signal_engine.mjs

      # ========================================
      # POST RUN AUDIT
      # ========================================
      - name: Post-run engine audit
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "POST-RUN AUDIT"
          echo "========================================"

          echo
          echo "Engine version:"

          grep -nE "const VERSION|DISCOVERY_SCHEMA" \
            crypto_whale_signal_engine.mjs || true

          echo
          echo "Git commit:"

          git rev-parse --short HEAD || true

          echo
          echo "State files:"

          find state -maxdepth 1 -type f -print 2>/dev/null || true

      # ========================================
      # COMMIT STATE
      # ========================================
      - name: Commit updated state
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            state/whale_watchlist.json \
            state/whale_performance_cache.json \
            state/.gitkeep \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update whale signal engine state"
          git push
