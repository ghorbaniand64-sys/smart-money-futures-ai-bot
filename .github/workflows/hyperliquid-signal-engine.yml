name: CRYPTO WHALE SIGNAL ENGINE

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: crypto-whale-signal-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    env:
      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # V4.4 — Helius Spot discovery
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      # Discovery configuration
      WHALE_DISCOVERY_MAX_CANDIDATES: '30'
      WHALE_DISCOVERY_FUTURES_QUICK_LOOKBACK_HOURS: '12'
      WHALE_DISCOVERY_FUTURES_DEEP_CANDIDATES: '15'
      WHALE_DISCOVERY_FUTURES_QUICK_MAX_PAGES: '1'
      WHALE_DISCOVERY_FUTURES_DEEP_MAX_PAGES: '8'
      WHALE_DISCOVERY_FUTURES_DEEP_DELAY_MS: '350'
      WHALE_DISCOVERY_RPC_FAST_RETRIES: '2'
      WHALE_DISCOVERY_RPC_FAST_DELAY_MS: '700'

      # Spot discovery
      WHALE_DISCOVERY_SPOT_PROGRAM_SIGS: '8'
      WHALE_DISCOVERY_SPOT_PROGRAM_TXS: '4'
      WHALE_DISCOVERY_SPOT_TOP_TOKENS: '8'
      WHALE_DISCOVERY_SPOT_CANDIDATE_WALLETS: '8'
      WHALE_DISCOVERY_SPOT_TX_LIMIT: '30'
      WHALE_DISCOVERY_SPOT_FINALISTS: '8'
      WHALE_DISCOVERY_SPOT_MAX_CANDIDATES: '8'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate worker
        run: |
          set -e

          test -f crypto_whale_signal_engine.mjs

          node --check crypto_whale_signal_engine.mjs

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE"
          echo "========================================"
          echo "Worker: crypto_whale_signal_engine.mjs"
          echo "Node: $(node --version)"
          echo "Helius: configured via production environment"
          echo "========================================"

      - name: Run whale signal engine
        run: |
          set -e

          node crypto_whale_signal_engine.mjs

      - name: Persist discovery cache
        if: always()
        run: |
          set -e

          if [ -f state/whale_watchlist.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state/whale_watchlist.json

            if git diff --cached --quiet; then
              echo "[CACHE] no changes"
            else
              git commit -m "chore: update whale discovery watchlist"
              git push
            fi
          else
            echo "[CACHE] state/whale_watchlist.json not created"
          fi
