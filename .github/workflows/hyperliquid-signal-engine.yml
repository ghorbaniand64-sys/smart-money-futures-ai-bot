name: Crypto Whale Signal Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine
  cancel-in-progress: false

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      NODE_OPTIONS: "--max-old-space-size=4096"

      # ============================================================
      # ENGINE MODE
      # ============================================================
      SIGNAL_ENGINE_MODE: "READ_ONLY"
      EXECUTION_ENABLED: "false"

      # ============================================================
      # DISCOVERY
      # ============================================================
      SIGNAL_SPOT_TARGET: "5"
      SIGNAL_FUTURES_TARGET: "5"

      SIGNAL_HOLD_MIN_HOURS: "1"
      SIGNAL_HOLD_MAX_HOURS: "24"

      # ============================================================
      # SPOT SIGNAL
      # ============================================================
      SIGNAL_SPOT_ACTIVITY_LOOKBACK_MIN: "15"
      SIGNAL_SPOT_MAX_ACTIVITY_AGE_MIN: "15"
      SIGNAL_SPOT_SIGNATURES: "80"

      SIGNAL_SPOT_MIN_BUY_USD: "25"

      SIGNAL_SPOT_SL_PCT: "2.0"
      SIGNAL_SPOT_TP_PCT: "4.0"

      # ============================================================
      # FUTURES SIGNAL
      # ============================================================
      SIGNAL_FUTURES_ACTIVITY_LOOKBACK_MIN: "120"
      SIGNAL_FUTURES_SIGNAL_FRESHNESS_MIN: "15"

      SIGNAL_FUTURES_GREEN_LATENCY_MIN: "5"
      SIGNAL_FUTURES_AVERAGING_GREEN_LATENCY_MIN: "10"

      SIGNAL_FUTURES_MIN_MEANINGFUL_ADD_NOTIONAL_USD: "100"

      SIGNAL_FUTURES_SL_PCT: "1.5"
      SIGNAL_FUTURES_TP_PCT: "3.0"

      SIGNAL_FUTURES_MAX_ACTIVE_LIFECYCLE_AGE_HOURS: "24"
      SIGNAL_FUTURES_MAX_ADVERSE_AVG_PCT: "5"

      # ============================================================
      # DISCOVERY / HISTORY
      # ============================================================
      DISCOVERY_FILL_MAX_PAGES: "8"
      DISCOVERY_FILL_PAGE_SIZE: "2000"

      SIGNAL_FUTURES_AUDIT_LOOKBACK_MIN: "1440"

      SIGNAL_FUTURES_BETWEEN_WALLETS_MS: "1200"
      SIGNAL_FUTURES_RETRY_BASE_MS: "1500"
      SIGNAL_FUTURES_FETCH_RETRY: "5"

      # ============================================================
      # SIGNAL RULES
      # ============================================================
      SIGNAL_ENTRY_WINDOW_PCT: "0.75"
      SIGNAL_WATCH_WINDOW_PCT: "3.0"
      SIGNAL_MIN_RR: "2"

      SIGNAL_MAX_LATENCY_MIN: "5"

      # ============================================================
      # PERFORMANCE
      # ============================================================
      SIGNAL_MAX_TELEGRAM_WHALE_BLOCKS: "10"
      SIGNAL_PERFORMANCE_LOOKBACK_DAYS: "30"
      SIGNAL_PERFORMANCE_CACHE_MIN: "15"
      SIGNAL_PERFORMANCE_MAX_PAGES: "8"
      SIGNAL_PERFORMANCE_PAGE_DELAY_MS: "250"

      SIGNAL_PERFORMANCE_STATE_FILE: "state/whale_performance_cache.json"

      # ============================================================
      # REPORT
      # ============================================================
      SIGNAL_SPOT_DIAGNOSTIC_MAX: "5"
      SIGNAL_MAX_SPOT_POSITIONS_PER_WALLET: "4"

      # ============================================================
      # CACHE
      # ============================================================
      SIGNAL_WATCHLIST_STATE_FILE: "state/whale_watchlist.json"

    steps:
      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. NODE 22
      # ------------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ------------------------------------------------------------
      # 3. BASIC ENVIRONMENT AUDIT
      # ------------------------------------------------------------
      - name: Environment audit
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE"
          echo "ENVIRONMENT AUDIT"
          echo "========================================"

          echo "Node:"
          node --version

          echo
          echo "Repository:"
          pwd

          echo
          echo "Git:"
          git rev-parse --short HEAD

          echo
          echo "Required files:"
          test -f crypto_whale_signal_engine.mjs
          test -f .github/workflows/crypto-whale-signal-engine.yml

          echo "crypto_whale_signal_engine.mjs = FOUND"
          echo "workflow = FOUND"

      # ------------------------------------------------------------
      # 4. HARD VERSION VERIFICATION
      #
      # IMPORTANT:
      # If V5.8 is not actually present in the repository,
      # STOP HERE.
      #
      # This prevents accidentally running V5.7 again.
      # ------------------------------------------------------------
      - name: VERIFY ENGINE VERSION
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ENGINE VERSION VERIFICATION"
          echo "========================================"

          echo
          echo "VERSION declarations:"
          grep -nE "const VERSION|V5\.[0-9]" crypto_whale_signal_engine.mjs || true

          echo
          echo "Expected:"
          echo "V5.8"

          if ! grep -q "V5.8" crypto_whale_signal_engine.mjs; then
            echo
            echo "========================================"
            echo "FATAL: WRONG ENGINE VERSION"
            echo "========================================"
            echo
            echo "The repository does NOT contain V5.8."
            echo "The workflow will NOT execute V5.7."
            echo
            echo "Upload/replace:"
            echo "crypto_whale_signal_engine.mjs"
            echo
            echo "with the V5.8 engine first."
            echo
            exit 1
          fi

          echo
          echo "VERSION CHECK: PASS"

      # ------------------------------------------------------------
      # 5. NODE SYNTAX CHECK
      # ------------------------------------------------------------
      - name: Node syntax check
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "NODE CHECK"
          echo "========================================"

          node --check crypto_whale_signal_engine.mjs

          echo
          echo "NODE CHECK: PASS"

      # ------------------------------------------------------------
      # 6. VERIFY CRITICAL V5.8 LOGIC IS PRESENT
      #
      # This catches cases where the version string was changed
      # but the actual discovery logic was not updated.
      # ------------------------------------------------------------
      - name: VERIFY V5.8 discovery logic
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "V5.8 LOGIC AUDIT"
          echo "========================================"

          FAIL=0

          check_pattern() {
            local NAME="$1"
            local PATTERN="$2"

            if grep -q "$PATTERN" crypto_whale_signal_engine.mjs; then
              echo "PASS | $NAME"
            else
              echo "FAIL | $NAME"
              FAIL=1
            fi
          }

          check_pattern \
            "V5.8 version marker" \
            "V5.8"

          check_pattern \
            "freshness logic" \
            "FUTURES_SIGNAL_FRESHNESS_MIN"

          check_pattern \
            "meaningful futures ADD" \
            "FUTURES_MIN_MEANINGFUL_ADD_NOTIONAL_USD"

          check_pattern \
            "spot minimum BUY" \
            "SPOT_MIN_BUY_USD"

          check_pattern \
            "watchlist state" \
            "whale_watchlist.json"

          check_pattern \
            "performance cache" \
            "whale_performance_cache.json"

          if [ "$FAIL" -ne 0 ]; then
            echo
            echo "FATAL: V5.8 logic audit failed."
            exit 1
          fi

          echo
          echo "V5.8 LOGIC AUDIT: PASS"

      # ------------------------------------------------------------
      # 7. CREATE STATE DIRECTORY
      # ------------------------------------------------------------
      - name: Prepare state directory
        shell: bash
        run: |
          set -e

          mkdir -p state

          touch state/.gitkeep

          echo "State directory ready."

      # ------------------------------------------------------------
      # 8. RUN ENGINE
      # ------------------------------------------------------------
      - name: Run Crypto Whale Signal Engine
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE"
          echo "========================================"
          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Orders: DISABLED"
          echo "Execution: DISABLED"
          echo "Engine: V5.8"
          echo "Schedule: every 5 minutes"
          echo "========================================"

          node crypto_whale_signal_engine.mjs

      # ------------------------------------------------------------
      # 9. POST-RUN VERSION AUDIT
      # ------------------------------------------------------------
      - name: Post-run engine audit
        if: always()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "POST-RUN AUDIT"
          echo "========================================"

          echo
          echo "Engine version:"
          grep -nE "const VERSION" crypto_whale_signal_engine.mjs || true

          echo
          echo "Workflow HEAD:"
          git rev-parse --short HEAD

          echo
          echo "State files:"
          find state -maxdepth 1 -type f -print 2>/dev/null || true

      # ------------------------------------------------------------
      # 10. COMMIT CACHE / STATE
      # ------------------------------------------------------------
      - name: Commit updated state
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/whale_watchlist.json \
                  state/whale_performance_cache.json \
                  state/.gitkeep \
                  2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update whale signal engine state"

          git push
