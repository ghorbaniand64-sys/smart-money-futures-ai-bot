name: CRYPTO WHALE SIGNAL ENGINE V6.3

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine-production
  cancel-in-progress: false

jobs:
  whale-signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment: production

    env:
      NODE_VERSION: "22"
      EXPECTED_ENGINE_VERSION: "V6.3"

      # ============================================================
      # API / SECRETS
      # ============================================================
      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      # ============================================================
      # ENGINE MODE — READ ONLY / SIGNAL ONLY
      # ============================================================
      EXECUTION_ENABLED: "false"
      DRY_RUN: "true"

      # ============================================================
      # DISCOVERY
      # ============================================================
      TARGET_SPOT_WALLETS: "5"
      TARGET_FUTURES_WALLETS: "5"

      DISCOVERY_TTL_MIN: "45"

      WHALE_DISCOVERY_SPOT_MIN_EVIDENCE_TRADES: "10"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUYS: "2"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUY_USD: "100"

      WHALE_DISCOVERY_ALLOW_ACTIVE_FALLBACK: "true"
      WHALE_DISCOVERY_SIGNAL_READY_ONLY: "false"

      WHALE_DISCOVERY_FUTURES_ACTIVE_SELECTION: "true"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_FILLS: "5"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_VOLUME_USD: "25000"
      WHALE_DISCOVERY_FUTURES_MIN_FRESH_ADD_USD: "100"

      # ============================================================
      # FUTURES SIGNAL ENGINE
      # ============================================================
      SIGNAL_FUTURES_MIN_ADD_USD: "100"
      SIGNAL_FUTURES_MIN_SIGNAL_WINDOW_NOTIONAL_USD: "100"

      SIGNAL_FUTURES_SIGNAL_FRESHNESS_MIN: "15"
      SIGNAL_FUTURES_ACTIVITY_LOOKBACK_MIN: "120"

      # ============================================================
      # FUTURES LIFECYCLE AUDIT
      # ============================================================
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_HOURS: "24"
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_MAX_PAGES: "3"
      SIGNAL_FUTURES_LIFECYCLE_BATCH_MIN: "3"

      # ============================================================
      # SPOT SIGNAL ENGINE
      # ============================================================
      SIGNAL_SPOT_MIN_BUY_USD: "25"
      SIGNAL_SPOT_ACTIVITY_LOOKBACK_MIN: "15"
      SIGNAL_SPOT_MAX_ACTIVITY_AGE_MIN: "15"

      # ============================================================
      # SIGNAL RISK MODEL
      # ============================================================
      SIGNAL_SPOT_SL_PCT: "2"
      SIGNAL_SPOT_TP_PCT: "4"

      SIGNAL_FUTURES_SL_PCT: "1.5"
      SIGNAL_FUTURES_TP_PCT: "3"

      # ============================================================
      # UNIFIED TRADER GATE
      #
      # SAME PERFORMANCE CONTRACT FOR DISCOVERY + SIGNAL GATE
      # ============================================================
      TRADER_MIN_CLOSED_TRADES: "10"
      TRADER_MIN_WR: "55"
      TRADER_MIN_PF: "1.25"

      SPOT_TRADER_MIN_CLOSED_TRADES: "10"
      SPOT_TRADER_MIN_WR: "55"
      SPOT_TRADER_MIN_PF: "1.25"

      # ============================================================
      # PERFORMANCE
      # ============================================================
      PERFORMANCE_LOOKBACK_DAYS: "30"
      PERFORMANCE_CACHE_MIN: "15"
      PERFORMANCE_MIN_CLOSED_TRADE_USD: "1"

      # ============================================================
      # SELF TEST
      # ============================================================
      WHALE_SELF_TEST: "true"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      # ============================================================
      # NODE
      #
      # IMPORTANT:
      # No npm cache here because the repository does not require
      # package-lock.json for setup-node cache.
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # VERIFY WORKER FILE
      # ============================================================
      - name: Verify worker file
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "V6.3 WORKER VERIFICATION"
          echo "========================================"

          test -f crypto_whale_signal_engine.mjs

          echo "PASS | crypto_whale_signal_engine.mjs exists"

      # ============================================================
      # VERIFY ENGINE VERSION
      # ============================================================
      - name: Verify engine version
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ENGINE VERSION"
          echo "========================================"

          ACTUAL_VERSION="$(
            node - <<'NODE'
            const fs = require('fs');

            const file = 'crypto_whale_signal_engine.mjs';
            const src = fs.readFileSync(file, 'utf8');

            const m = src.match(
              /const\s+VERSION\s*=\s*['"]([^'"]+)['"]/
            );

            if (!m) {
              console.error('FATAL: VERSION constant not found');
              process.exit(1);
            }

            process.stdout.write(m[1]);
            NODE
          )"

          echo "Expected: ${EXPECTED_ENGINE_VERSION}"
          echo "Actual:   ${ACTUAL_VERSION}"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_ENGINE_VERSION" ]; then
            echo "FATAL: engine version mismatch"
            exit 1
          fi

          echo "PASS | engine version ${ACTUAL_VERSION}"

      # ============================================================
      # NODE SYNTAX CHECK
      # ============================================================
      - name: Node syntax check
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "NODE SYNTAX CHECK"
          echo "========================================"

          node --check crypto_whale_signal_engine.mjs

          echo "PASS | node --check"

      # ============================================================
      # V6.3 CONTRACT VERIFICATION
      # ============================================================
      - name: V6.3 contract verification
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "V6.3 CONTRACT VERIFICATION"
          echo "========================================"

          FILE="crypto_whale_signal_engine.mjs"

          require_pattern() {
            PATTERN="$1"
            LABEL="$2"

            if grep -Fq "$PATTERN" "$FILE"; then
              echo "PASS | $LABEL"
            else
              echo "FATAL: missing V6.3 contract: $LABEL"
              echo "Pattern: $PATTERN"
              exit 1
            fi
          }

          # Legacy / previous contracts that must remain present
          require_pattern \
            "V6.1-SPOT-FIFO-PERFORMANCE-V3" \
            "V6.1 spot FIFO performance"

          require_pattern \
            "V6.1-SPOT-PERFORMANCE-FUTURES-RECON-AUDITED" \
            "V6.1 futures recon audited"

          require_pattern \
            "V6.2-TRADE-LIFECYCLE-MARKET-TYPE-LEVERAGE-AUDIT" \
            "V6.2 lifecycle market type leverage"

          # V6.3
          require_pattern \
            "V6.3" \
            "V6.3 engine"

          # Market contracts
          require_pattern \
            "marketType:'FUTURES'" \
            "FUTURES marketType"

          require_pattern \
            "marketType:'SPOT'" \
            "SPOT marketType"

          # Lifecycle
          require_pattern \
            "FUTURES_LIFECYCLE_AUDIT_HOURS" \
            "futures lifecycle audit hours"

          require_pattern \
            "FUTURES_LIFECYCLE_AUDIT_MAX_PAGES" \
            "futures lifecycle audit max pages"

          # Leverage
          require_pattern \
            "leverageSource:'HYPERLIQUID_CLEARINGHOUSE_STATE'" \
            "live Hyperliquid clearinghouse leverage"

          # Unified trader gate
          require_pattern \
            "TRADER_MIN_CLOSED_TRADES" \
            "unified minimum closed trades"

          require_pattern \
            "TRADER_MIN_WR" \
            "unified minimum win rate"

          require_pattern \
            "TRADER_MIN_PF" \
            "unified minimum profit factor"

          # Spot gate
          require_pattern \
            "SPOT_TRADER_MIN_CLOSED_TRADES" \
            "spot minimum closed trades"

          require_pattern \
            "SPOT_TRADER_MIN_WR" \
            "spot minimum win rate"

          require_pattern \
            "SPOT_TRADER_MIN_PF" \
            "spot minimum profit factor"

          echo "========================================"
          echo "PASS | V6.3 CONTRACT VERIFICATION"
          echo "========================================"

      # ============================================================
      # SELF TEST
      # ============================================================
      - name: V6.3 self test
        shell: bash
        env:
          WHALE_SELF_TEST: "true"
          EXECUTION_ENABLED: "false"
          DRY_RUN: "true"
        run: |
          set -e

          echo "========================================"
          echo "V6.3 SELF TEST"
          echo "========================================"

          node crypto_whale_signal_engine.mjs

          echo "========================================"
          echo "PASS | V6.3 SELF TEST"
          echo "========================================"

      # ============================================================
      # LIVE SIGNAL RUN
      #
      # Still READ-ONLY / SIGNAL-ONLY.
      # No order execution.
      # ============================================================
      - name: Run whale signal engine
        shell: bash
        env:
          WHALE_SELF_TEST: "false"
          EXECUTION_ENABLED: "false"
          DRY_RUN: "true"
        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.3"
          echo "========================================"

          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Execution: DISABLED"
          echo "Dry run: TRUE"
          echo "Engine: ${EXPECTED_ENGINE_VERSION}"
          echo "========================================"

          node crypto_whale_signal_engine.mjs

      # ============================================================
      # PERSIST STATE
      #
      # IMPORTANT:
      # 1. Fetch latest remote main
      # 2. Rebase our state commit on top
      # 3. Push HEAD -> main
      #
      # This fixes:
      # ! [rejected] main -> main (fetch first)
      # ============================================================
      - name: Persist state
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PERSIST STATE"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update whale signal engine state"

          echo "Fetching latest remote main..."

          git fetch origin main

          echo "Rebasing local state commit onto origin/main..."

          git rebase origin/main

          echo "Pushing synchronized state..."

          git push origin HEAD:main

          echo "========================================"
          echo "PASS | STATE PUSHED"
          echo "========================================"

      # ============================================================
      # FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.3"
          echo "========================================"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID:   ${{ github.run_id }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Mode:     READ-ONLY / SIGNAL-ONLY"
          echo "Orders:   DISABLED"
          echo "========================================"
