name: Crypto Whale Signal Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine
  cancel-in-progress: false

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      # ============================================================
      # REQUIRED SECRETS — GitHub Environment: production
      # ============================================================
      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      # ============================================================
      # ENGINE
      # ============================================================
      NODE_OPTIONS: "--max-old-space-size=4096"
      SIGNAL_ENGINE_MODE: "READ_ONLY"
      EXECUTION_ENABLED: "false"

      # ============================================================
      # WHALE DISCOVERY
      # ============================================================
      WHALE_TARGET_SPOT_WALLETS: "5"
      WHALE_TARGET_FUTURES_WALLETS: "5"

      WHALE_DISCOVERY_TTL_MIN: "360"
      WHALE_DISCOVERY_LOOKBACK_HOURS: "48"

      WHALE_DISCOVERY_MIN_HOLD_HOURS: "1"
      WHALE_DISCOVERY_MAX_HOLD_HOURS: "24"

      WHALE_DISCOVERY_MIN_VOLUME_USD: "250000"
      WHALE_DISCOVERY_MIN_COMPLETED: "3"
      WHALE_DISCOVERY_MIN_IN_WINDOW: "5"
      WHALE_DISCOVERY_MIN_HOLD_RATIO: "0.5"
      WH
