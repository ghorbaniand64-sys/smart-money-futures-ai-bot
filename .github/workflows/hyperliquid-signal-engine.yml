name: CRYPTO WHALE SIGNAL ENGINE

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine-production
  cancel-in-progress: false

jobs:
  whale-signal-engine:
    name: Crypto Whale Signal Engine V6.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      NODE_ENV: production

      # ============================================================
      # PRODUCTION SECRETS
      # ============================================================
      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      # ============================================================
      # ENGINE VERSION
      # MUST MATCH:
      # const VERSION = 'V6.1';
      # ============================================================
      EXPECTED_ENGINE_VERSION: "V6.1"

      # ============================================================
      # DISCOVERY / WATCHLIST
      # ============================================================
      TARGET_SPOT_WALLETS: "5"
      TARGET_FUTURES_WALLETS: "5"
      DISCOVERY_TTL_MIN: "45"

      # ============================================================
      # SPOT QUALITY
      # ============================================================
      WHALE_DISCOVERY_SPOT_MIN_EVIDENCE_TRADES: "10"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUYS: "2"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUY_USD: "100"
      WHALE_DISCOVERY_ALLOW_ACTIVE_FALLBACK: "true"

      # ============================================================
      # FUTURES DISCOVERY
      #
      # IMPORTANT:
      # Discovery selects ACTIVE Futures wallets.
      # It does NOT require a fresh ADD at discovery time.
      #
      # scanFutures() is responsible for the final:
      # - ADD >= $100
      # - freshness <= 15m
      # - distance
      # - RR
      # ============================================================
      WHALE_DISCOVERY_SIGNAL_READY_ONLY: "false"
      WHALE_DISCOVERY_FUTURES_ACTIVE_SELECTION: "true"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_FILLS: "5"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_VOLUME_USD: "25000"
      WHALE_DISCOVERY_FUTURES_MIN_FRESH_ADD_USD: "100"

      # ============================================================
      # FUTURES SIGNAL RULES
      # ============================================================
      SIGNAL_FUTURES_MIN_ADD_USD: "100"
      SIGNAL_FUTURES_MIN_SIGNAL_WINDOW_NOTIONAL_USD: "100"
      SIGNAL_FUTURES_SIGNAL_FRESHNESS_MIN: "15"
      SIGNAL_FUTURES_ACTIVITY_LOOKBACK_MIN: "120"

      # ============================================================
      # SPOT SIGNAL RULES
      # ============================================================
      SIGNAL_SPOT_MIN_BUY_USD: "25"
      SIGNAL_SPOT_ACTIVITY_LOOKBACK_MIN: "15"
      SIGNAL_SPOT_MAX_ACTIVITY_AGE_MIN: "15"
      SIGNAL_MAX_SIGNAL_LATENCY_MIN: "5"

      SIGNAL_SPOT_SL_PCT: "2.0"
      SIGNAL_SPOT_TP_PCT: "4.0"

      SIGNAL_FUTURES_SL_PCT: "1.5"
      SIGNAL_FUTURES_TP_PCT: "3.0"

      # ============================================================
      # PERFORMANCE
      # ============================================================
      PERFORMANCE_LOOKBACK_DAYS: "30"
      PERFORMANCE_CACHE_MIN: "15"
      PERFORMANCE_MIN_CLOSED_TRADE_USD: "1"

      # ============================================================
      # SAFETY
      # ============================================================
      EXECUTION_ENABLED: "false"
      DRY_RUN: "true"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ============================================================
      # STATE DIRECTORY
      # ============================================================
      - name: Prepare state directory
        shell: bash
        run: |
          set -e

          mkdir -p state

      # ============================================================
      # WORKER FILE CHECK
      # ============================================================
      - name: Verify required worker exists
        shell: bash
        run: |
          set -e

          WORKER="crypto_whale_signal_engine.mjs"

          echo "========================================"
          echo "WORKER FILE VERIFICATION"
          echo "========================================"

          if [ ! -f "$WORKER" ]; then
            echo "FATAL: $WORKER not found"
            echo
            echo "Repository root:"
            ls -la
            exit 1
          fi

          echo "Worker: $WORKER"
          echo "Size:"
          wc -c "$WORKER"

      # ============================================================
      # V6.1 VERSION GATE
      # ============================================================
      - name: Verify engine version V6.1
        shell: bash
        env:
          EXPECTED_ENGINE_VERSION: "V6.1"
        run: |
          set -e

          WORKER="crypto_whale_signal_engine.mjs"

          echo "========================================"
          echo "ENGINE VERSION VERIFICATION"
          echo "========================================"

          echo
          echo "VERSION declarations:"
          grep -n "const VERSION" "$WORKER" || true

          ACTUAL_VERSION="$(node -e "
            const fs = require('fs');

            const file = process.argv[1];
            const source = fs.readFileSync(file, 'utf8');

            const match = source.match(
              /const\\s+VERSION\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]/
            );

            if (!match) {
              process.exit(2);
            }

            process.stdout.write(match[1]);
          " "$WORKER")"

          echo
          echo "Expected:"
          echo "$EXPECTED_ENGINE_VERSION"

          echo

          if [ "$ACTUAL_VERSION" != "$EXPECTED_ENGINE_VERSION" ]; then
            echo "========================================"
            echo "FATAL: WRONG ENGINE VERSION"
            echo "========================================"
            echo
            echo "Repository contains: $ACTUAL_VERSION"
            echo "Workflow expects:     $EXPECTED_ENGINE_VERSION"
            echo
            exit 1
          fi

          echo "========================================"
          echo "ENGINE VERSION VERIFIED: $ACTUAL_VERSION"
          echo "========================================"

      # ============================================================
      # NODE SYNTAX
      # ============================================================
      - name: Node syntax check
        shell: bash
        run: |
          set -e

          node --check crypto_whale_signal_engine.mjs

          echo "========================================"
          echo "NODE SYNTAX CHECK PASSED"
          echo "========================================"

      # ============================================================
      # V6.1 CONTRACT VERIFICATION
      # ============================================================
      - name: Verify critical V6.1 contracts
        shell: bash
        run: |
          set -e

          WORKER="crypto_whale_signal_engine.mjs"

          echo "========================================"
          echo "V6.1 CONTRACT VERIFICATION"
          echo "========================================"

          required_patterns=(
            "V6.1-SPOT-FIFO-PERFORMANCE-V3"
            "V6.1-SPOT-PERFORMANCE-FUTURES-RECON-AUDITED"
            "DISCOVERY_FUTURES_ACTIVE_SELECTION"
            "FUTURES_MIN_ACTIVE_FILLS"
            "FUTURES_MIN_ACTIVE_VOLUME_USD"
            "FUTURES_MIN_SIGNAL_ADD_USD"
            "FUTURES_MIN_SIGNAL_WINDOW_NOTIONAL_USD"
            "FUTURES_SIGNAL_FRESHNESS_MIN"
            "SPOT_MIN_SIGNAL_BUY_USD"
          )

          for pattern in "${required_patterns[@]}"; do
            if ! grep -q "$pattern" "$WORKER"; then
              echo "FATAL: missing V6.1 contract: $pattern"
              exit 1
            fi

            echo "PASS | $pattern"
          done

          echo
          echo "========================================"
          echo "V6.1 CONTRACTS VERIFIED"
          echo "========================================"

      # ============================================================
      # RUNTIME CONFIGURATION
      # ============================================================
      - name: Print runtime configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.1"
          echo "========================================"

          echo
          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Orders: DISABLED"
          echo "Execution: DISABLED"

          echo
          echo "Watchlist:"
          echo "Spot target: 5"
          echo "Futures target: 5"

          echo
          echo "Spot quality:"
          echo "Minimum evidence trades: 10"
          echo "Minimum recent BUYs: 2"
          echo "Minimum recent BUY volume: \$100"

          echo
          echo "Futures:"
          echo "Discovery: ACTIVE WALLET SELECTION"
          echo "Fresh ADD minimum: \$100"
          echo "Freshness: <= 15m"

          echo
          echo "Signal rules:"
          echo "Entry distance: <= 0.75%"
          echo "Watch distance: <= 3%"
          echo "Minimum RR: 2.0"
          echo "Freshness: <= 15m"

          echo
          echo "Execution:"
          echo "NO ORDERS"
          echo "NO POSITION CHANGES"
          echo "NO LEVERAGE CHANGES"

          echo
          echo "Engine: V6.1"

          echo "========================================"

      # ============================================================
      # RUN ENGINE
      # ============================================================
      - name: Run Crypto Whale Signal Engine V6.1
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STARTING CRYPTO WHALE SIGNAL ENGINE V6.1"
          echo "========================================"

          node crypto_whale_signal_engine.mjs

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.1 FINISHED"
          echo "========================================"

      # ============================================================
      # PERSIST STATE
      # ============================================================
      - name: Persist state changes
        if: always()
        shell: bash
        run: |
          set -e

          if [ -n "$(git status --porcelain)" ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state/

            if ! git diff --cached --quiet; then
              git commit -m "chore: update whale signal engine state"
              git push
            fi

          else

            echo "No state changes to commit."

          fi
