name: CRYPTO WHALE SIGNAL ENGINE

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-whale-signal-engine-production
  cancel-in-progress: false

jobs:
  whale-signal-engine:
    name: Crypto Whale Signal Engine V6.2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      NODE_ENV: production

      # ============================================================
      # PRODUCTION SECRETS
      # ============================================================
      HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

      # ============================================================
      # ENGINE VERSION
      # ============================================================
      EXPECTED_ENGINE_VERSION: "V6.2"

      # ============================================================
      # DISCOVERY / WATCHLIST
      # ============================================================
      TARGET_SPOT_WALLETS: "5"
      TARGET_FUTURES_WALLETS: "5"
      DISCOVERY_TTL_MIN: "45"

      # ============================================================
      # SPOT DISCOVERY QUALITY
      # ============================================================
      WHALE_DISCOVERY_SPOT_MIN_EVIDENCE_TRADES: "10"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUYS: "2"
      WHALE_DISCOVERY_SPOT_MIN_RECENT_BUY_USD: "100"
      WHALE_DISCOVERY_ALLOW_ACTIVE_FALLBACK: "true"

      # ============================================================
      # FUTURES DISCOVERY
      # ============================================================
      WHALE_DISCOVERY_SIGNAL_READY_ONLY: "false"
      WHALE_DISCOVERY_FUTURES_ACTIVE_SELECTION: "true"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_FILLS: "5"
      WHALE_DISCOVERY_FUTURES_MIN_ACTIVE_VOLUME_USD: "25000"
      WHALE_DISCOVERY_FUTURES_MIN_FRESH_ADD_USD: "100"

      # ============================================================
      # FUTURES SIGNAL RULES
      # ============================================================
      SIGNAL_FUTURES_MIN_ADD_USD: "100"
      SIGNAL_FUTURES_MIN_SIGNAL_WINDOW_NOTIONAL_USD: "100"
      SIGNAL_FUTURES_SIGNAL_FRESHNESS_MIN: "15"
      SIGNAL_FUTURES_ACTIVITY_LOOKBACK_MIN: "120"

      # ============================================================
      # V6.2 FUTURES LIFECYCLE AUDIT
      # ============================================================
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_HOURS: "24"
      SIGNAL_FUTURES_LIFECYCLE_AUDIT_MAX_PAGES: "3"

      # ============================================================
      # SPOT SIGNAL RULES
      # ============================================================
      SIGNAL_SPOT_MIN_BUY_USD: "25"
      SIGNAL_SPOT_ACTIVITY_LOOKBACK_MIN: "15"
      SIGNAL_SPOT_MAX_ACTIVITY_AGE_MIN: "15"

      # ============================================================
      # GENERAL SIGNAL LATENCY
      # ============================================================
      SIGNAL_MAX_SIGNAL_LATENCY_MIN: "5"

      # ============================================================
      # RISK / TARGETS
      # ============================================================
      SIGNAL_SPOT_SL_PCT: "2.0"
      SIGNAL_SPOT_TP_PCT: "4.0"

      SIGNAL_FUTURES_SL_PCT: "1.5"
      SIGNAL_FUTURES_TP_PCT: "3.0"

      # ============================================================
      # PERFORMANCE
      # ============================================================
      PERFORMANCE_LOOKBACK_DAYS: "30"
      PERFORMANCE_CACHE_MIN: "15"
      PERFORMANCE_MIN_CLOSED_TRADE_USD: "1"

      # ============================================================
      # SAFETY
      # READ-ONLY / SIGNAL-ONLY
      # ============================================================
      EXECUTION_ENABLED: "false"
      DRY_RUN: "true"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # NODE 22
      #
      # IMPORTANT:
      # No npm cache is enabled here because this repository
      # does not contain package-lock.json / npm-shrinkwrap.json
      # / yarn.lock.
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # STATE DIRECTORY
      # ============================================================
      - name: Prepare state directory
        shell: bash
        run: |
          set -e

          mkdir -p state

          echo "========================================"
          echo "STATE DIRECTORY READY"
          echo "========================================"

      # ============================================================
      # WORKER FILE VERIFICATION
      # ============================================================
      - name: Verify required worker exists
        shell: bash
        run: |
          set -e

          WORKER="crypto_whale_signal_engine.mjs"

          echo "========================================"
          echo "WORKER FILE VERIFICATION"
          echo "========================================"

          if [ ! -f "$WORKER" ]; then
            echo "FATAL: $WORKER not found"
            echo
            echo "Repository root:"
            ls -la
            echo
            exit 1
          fi

          echo "Worker: $WORKER"
          echo "Bytes:"
          wc -c "$WORKER"

          echo
          echo "Worker exists: PASS"
          echo "========================================"

      # ============================================================
      # ENGINE VERSION VERIFICATION
      # ============================================================
      - name: Verify engine version V6.2
        shell: bash
        env:
          EXPECTED_ENGINE_VERSION: "V6.2"
        run: |
          set -e

          WORKER="crypto_whale_signal_engine.mjs"

          echo "========================================"
          echo "ENGINE VERSION VERIFICATION"
          echo "========================================"

          echo
          echo "VERSION declarations:"
          grep -n "const VERSION" "$WORKER" || true

          ACTUAL_VERSION="$(node -e "
            const fs=require('fs');

            const s=fs.readFileSync(process.argv[1],'utf8');

            const m=s.match(
              /const\\s+VERSION\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]/
            );

            if(!m) {
              console.error('VERSION declaration not found');
              process.exit(2);
            }

            process.stdout.write(m[1]);
          " "$WORKER")"

          echo
          echo "Expected:"
          echo "$EXPECTED_ENGINE_VERSION"

          echo
          echo "Actual:"
          echo "$ACTUAL_VERSION"

          echo

          if [ "$ACTUAL_VERSION" != "$EXPECTED_ENGINE_VERSION" ]; then
            echo "========================================"
            echo "FATAL: WRONG ENGINE VERSION"
            echo "========================================"
            echo
            echo "Repository contains: $ACTUAL_VERSION"
            echo "Workflow expects:     $EXPECTED_ENGINE_VERSION"
            echo
            exit 1
          fi

          echo "========================================"
          echo "ENGINE VERSION VERIFIED: $ACTUAL_VERSION"
          echo "========================================"

      # ============================================================
      # NODE SYNTAX CHECK
      # ============================================================
      - name: Node syntax check
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "NODE SYNTAX CHECK"
          echo "========================================"

          node --check crypto_whale_signal_engine.mjs

          echo
          echo "PASS | node --check"
          echo "========================================"

      # ============================================================
      # V6.2 CONTRACT VERIFICATION
      # ============================================================
      - name: Verify critical V6.2 contracts
        shell: bash
        run: |
          set -e

          WORKER="crypto_whale_signal_engine.mjs"

          echo "========================================"
          echo "V6.2 CONTRACT VERIFICATION"
          echo "========================================"

          required_patterns=(
            "V6.1-SPOT-FIFO-PERFORMANCE-V3"
            "V6.1-SPOT-PERFORMANCE-FUTURES-RECON-AUDITED"
            "V6.2-TRADE-LIFECYCLE-MARKET-TYPE-LEVERAGE-AUDIT"
            "marketType:'FUTURES'"
            "FUTURES_LIFECYCLE_AUDIT_HOURS"
            "FUTURES_LIFECYCLE_AUDIT_MAX_PAGES"
            "leverageSource:'HYPERLIQUID_CLEARINGHOUSE_STATE'"
          )

          for pattern in "${required_patterns[@]}"; do
            if ! grep -q "$pattern" "$WORKER"; then
              echo "FATAL: missing V6.2 contract: $pattern"
              exit 1
            fi

            echo "PASS | $pattern"
          done

          echo
          echo "========================================"
          echo "V6.2 CONTRACTS VERIFIED"
          echo "========================================"

      # ============================================================
      # SELF TEST
      # ============================================================
      - name: Run V6.2 self-test
        shell: bash
        env:
          WHALE_SELF_TEST: "true"
        run: |
          set -e

          echo "========================================"
          echo "V6.2 SELF-TEST"
          echo "========================================"

          WHALE_SELF_TEST=true \
            node crypto_whale_signal_engine.mjs

          echo
          echo "========================================"
          echo "V6.2 SELF-TEST PASSED"
          echo "========================================"

      # ============================================================
      # RUNTIME CONFIGURATION
      # ============================================================
      - name: Print runtime configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.2"
          echo "========================================"

          echo
          echo "Mode: READ-ONLY / SIGNAL-ONLY"
          echo "Orders: DISABLED"
          echo "Execution: DISABLED"
          echo "Dry Run: TRUE"

          echo
          echo "----------------------------------------"
          echo "WATCHLIST"
          echo "----------------------------------------"

          echo "Spot target: 5"
          echo "Futures target: 5"
          echo "Discovery TTL: 45m"

          echo
          echo "----------------------------------------"
          echo "SPOT QUALITY"
          echo "----------------------------------------"

          echo "Minimum evidence trades: 10"
          echo "Minimum recent BUYs: 2"
          echo "Minimum recent BUY volume: \$100"

          echo
          echo "----------------------------------------"
          echo "FUTURES DISCOVERY"
          echo "----------------------------------------"

          echo "Discovery: ACTIVE WALLET SELECTION"
          echo "Minimum active fills: 5"
          echo "Minimum active volume: \$25,000"
          echo "Fresh ADD minimum: \$100"

          echo
          echo "----------------------------------------"
          echo "FUTURES SIGNAL"
          echo "----------------------------------------"

          echo "Fresh ADD minimum: \$100"
          echo "Freshness: <= 15m"
          echo "Activity lookback: 120m"

          echo
          echo "----------------------------------------"
          echo "FUTURES LIFECYCLE"
          echo "----------------------------------------"

          echo "Lifecycle audit: 24h"
          echo "Lifecycle audit max pages: 3"
          echo "Leverage source: Hyperliquid clearinghouse state"

          echo
          echo "Lifecycle labels:"
          echo "NEW ENTRY"
          echo "ADD #2"
          echo "ADD #3"
          echo "ADD #N"

          echo
          echo "----------------------------------------"
          echo "SPOT SIGNAL"
          echo "----------------------------------------"

          echo "Minimum BUY: \$25"
          echo "Activity lookback: 15m"
          echo "Maximum signal age: 15m"

          echo
          echo "----------------------------------------"
          echo "RISK / TARGETS"
          echo "----------------------------------------"

          echo "Spot SL: 2.0%"
          echo "Spot TP: 4.0%"
          echo "Spot RR: 2.0"

          echo "Futures SL: 1.5%"
          echo "Futures TP: 3.0%"
          echo "Futures RR: 2.0"

          echo
          echo "----------------------------------------"
          echo "EXECUTION SAFETY"
          echo "----------------------------------------"

          echo "NO ORDERS"
          echo "NO POSITION CHANGES"
          echo "NO LEVERAGE CHANGES"

          echo
          echo "----------------------------------------"
          echo "ENGINE"
          echo "----------------------------------------"

          echo "V6.2"
          echo "========================================"

      # ============================================================
      # RUN ENGINE
      # ============================================================
      - name: Run Crypto Whale Signal Engine V6.2
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STARTING CRYPTO WHALE SIGNAL ENGINE V6.2"
          echo "========================================"

          node crypto_whale_signal_engine.mjs

          echo
          echo "========================================"
          echo "CRYPTO WHALE SIGNAL ENGINE V6.2 FINISHED"
          echo "========================================"

      # ============================================================
      # PERSIST STATE
      # ============================================================
      - name: Persist state changes
        if: always()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STATE PERSISTENCE"
          echo "========================================"

          if [ -n "$(git status --porcelain)" ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state/

            if ! git diff --cached --quiet; then

              git commit -m "chore: update whale signal engine state"

              git push

              echo "State changes committed and pushed."

            else

              echo "No staged state changes."

            fi

          else

            echo "No state changes to commit."

          fi

          echo "========================================"
          echo "STATE PERSISTENCE FINISHED"
          echo "========================================"
