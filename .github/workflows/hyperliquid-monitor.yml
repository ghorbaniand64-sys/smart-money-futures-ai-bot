name: Hyperliquid Trader Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Hunter
        run: |
          test -f hyperliquid_trader_hunter.mjs
          echo "[OK] hyperliquid_trader_hunter.mjs found"
          node --check hyperliquid_trader_hunter.mjs
          echo "[OK] JavaScript syntax valid"

      - name: Run Hyperliquid Trader Hunter
        env:
          HYPERLIQUID_API_URL: ${{ vars.HYPERLIQUID_API_URL }}
          HYPERLIQUID_TRADERS: ${{ vars.HYPERLIQUID_TRADERS }}
          HYPERLIQUID_HUNTER_DISCOVERY_ENABLED: ${{ vars.HYPERLIQUID_HUNTER_DISCOVERY_ENABLED }}
          HYPERLIQUID_HUNTER_DISCOVERY_URL: ${{ vars.HYPERLIQUID_HUNTER_DISCOVERY_URL }}
          HYPERLIQUID_HUNTER_CANDIDATES: ${{ vars.HYPERLIQUID_HUNTER_CANDIDATES }}
          HYPERLIQUID_HUNTER_LOOKBACK_DAYS: ${{ vars.HYPERLIQUID_HUNTER_LOOKBACK_DAYS }}
          HYPERLIQUID_HUNTER_MAX_CANDIDATES: ${{ vars.HYPERLIQUID_HUNTER_MAX_CANDIDATES }}
          HYPERLIQUID_HUNTER_MIN_7D_TRADES: ${{ vars.HYPERLIQUID_HUNTER_MIN_7D_TRADES }}
          HYPERLIQUID_HUNTER_MIN_7D_WIN_RATE: ${{ vars.HYPERLIQUID_HUNTER_MIN_7D_WIN_RATE }}
          HYPERLIQUID_HUNTER_MIN_7D_PNL: ${{ vars.HYPERLIQUID_HUNTER_MIN_7D_PNL }}
          HYPERLIQUID_HUNTER_MIN_PROFIT_FACTOR: ${{ vars.HYPERLIQUID_HUNTER_MIN_PROFIT_FACTOR }}
          HYPERLIQUID_HUNTER_MAX_MEDIAN_HOLD_HOURS: ${{ vars.HYPERLIQUID_HUNTER_MAX_MEDIAN_HOLD_HOURS }}
          HYPERLIQUID_HUNTER_MAX_AVG_HOLD_HOURS: ${{ vars.HYPERLIQUID_HUNTER_MAX_AVG_HOLD_HOURS }}
          HYPERLIQUID_HUNTER_MIN_ACTIVE_DAYS: ${{ vars.HYPERLIQUID_HUNTER_MIN_ACTIVE_DAYS }}
          HYPERLIQUID_HUNTER_MAX_LOSING_STREAK: ${{ vars.HYPERLIQUID_HUNTER_MAX_LOSING_STREAK }}
          HYPERLIQUID_HUNTER_MAX_LIQUIDATIONS: ${{ vars.HYPERLIQUID_HUNTER_MAX_LIQUIDATIONS }}
          HYPERLIQUID_HUNTER_MIN_SETUP_RR: ${{ vars.HYPERLIQUID_HUNTER_MIN_SETUP_RR }}
          HYPERLIQUID_HUNTER_MAX_ENTRY_DISTANCE_PCT: ${{ vars.HYPERLIQUID_HUNTER_MAX_ENTRY_DISTANCE_PCT }}
          HYPERLIQUID_HUNTER_SL_ATR_MULT: ${{ vars.HYPERLIQUID_HUNTER_SL_ATR_MULT }}
          HYPERLIQUID_HUNTER_TP_ATR_MULT: ${{ vars.HYPERLIQUID_HUNTER_TP_ATR_MULT }}
          HYPERLIQUID_HUNTER_MAX_PLANNED_HOLD_HOURS: ${{ vars.HYPERLIQUID_HUNTER_MAX_PLANNED_HOLD_HOURS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: node hyperliquid_trader_hunter.mjs
