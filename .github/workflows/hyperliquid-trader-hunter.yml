name: Crypto Whale Signal Engine

on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-whale-signal-engine
  cancel-in-progress: true

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify signal engine exists
        run: |
          test -f hyperliquid_trader_hunter.mjs
          node --check hyperliquid_trader_hunter.mjs

      - name: Verify execution engine is absent
        run: |
          if [ -f hyperliquid_execution_engine.mjs ]; then
            echo "ERROR: hyperliquid_execution_engine.mjs exists."
            echo "This repository must be signal-only."
            exit 1
          fi

      - name: Verify no execution workflow exists
        run: |
          if grep -RniE \
            'hyperliquid_execution_engine|EXECUTION_ENABLED|PRIVATE_KEY|PRIVATEKEY|placeOrder|createOrder|cancelOrder|updateLeverage|setLeverage' \
            .github/workflows hyperliquid_trader_hunter.mjs 2>/dev/null; then
            echo "ERROR: Execution-related content detected."
            echo "Signal engine must remain read-only."
            exit 1
          fi

      - name: Verify Telegram secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Run signal engine
        env:
          HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          SIGNAL_MAX_ENTRY_DISTANCE_PCT: "0.75"
          SIGNAL_MIN_RR: "2.0"

          SIGNAL_SPOT_SL_PCT: "2.0"
          SIGNAL_SPOT_TP_PCT: "4.0"

          SIGNAL_FUTURES_SL_PCT: "1.5"
          SIGNAL_FUTURES_TP_PCT: "3.0"

          SIGNAL_SPOT_SIGNATURES: "30"
          SIGNAL_MAX_SPOT_POSITIONS_PER_WALLET: "5"
          SIGNAL_REQUEST_TIMEOUT_MS: "20000"

        run: |
          node hyperliquid_trader_hunter.mjs
