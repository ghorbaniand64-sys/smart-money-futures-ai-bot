name: Hyperliquid Trader Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate worker
        run: node --check hyperliquid_trader_hunter.mjs

      - name: Validate execution engine
        run: node --check hyperliquid_execution_engine.mjs

      - name: Run Meme Hunter
        env:
          HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node hyperliquid_trader_hunter.mjs

      - name: Run Execution Engine (DRY RUN)
        env:
          HYPERLIQUID_API_URL: ${{ secrets.HYPERLIQUID_API_URL }}
          HYPERLIQUID_ACCOUNT_ADDRESS: ${{ secrets.HYPERLIQUID_ACCOUNT_ADDRESS }}
          HYPERLIQUID_AGENT_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_AGENT_PRIVATE_KEY }}
          EXECUTION_ENABLED: 'false'
          EXECUTION_DRY_RUN: 'true'
          HYPERLIQUID_EXECUTION_HANDOFF_TTL_MS: '90000'
          EXECUTION_MAX_SOURCE_ENTRY_DISTANCE_PCT: '0.5'
          EXECUTION_MAX_REVALIDATION_MOVE_PCT: '0.35'
          EXECUTION_SLIPPAGE_BPS: '50'
          EXECUTION_TARGET_NOTIONAL_USD: '10'
          EXECUTION_MAX_NOTIONAL_USD: '25'
          EXECUTION_MAX_ACCOUNT_ALLOCATION_PCT: '1'
          EXECUTION_MAX_LEVERAGE: '3'
          EXECUTION_MIN_RR: '1.5'
          EXECUTION_SL_ATR_MULT: '1.2'
          EXECUTION_TP_ATR_MULT: '2.0'
          EXECUTION_MAX_SL_PCT: '2.0'
          EXECUTION_REQUIRE_MEME: 'true'
          EXECUTION_REQUIRE_HANDOFF_READY: 'true'
          HYPERLIQUID_TESTNET: 'false'
        run: node hyperliquid_execution_engine.mjs
